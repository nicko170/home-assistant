# Home Assistant Stack - Host Networking Edition
# Includes: Home Assistant, Node-RED, ESPHome, Scrypted, Cloudflared
#
# With host networking, all services share the host's network stack
# mDNS/SSDP discovery works properly, no port mapping needed

services:
  # ============================================================================
  # HOME ASSISTANT
  # ============================================================================
  # Access: http://<host-ip>:8123
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - ./homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    environment:
      - TZ=Australia/Sydney
    restart: unless-stopped
    privileged: true
    network_mode: host
  # ============================================================================
  # ESPHOME
  # ============================================================================
  # Access: http://<host-ip>:6052
  # mDNS discovery works with host networking
  esphome:
    container_name: esphome
    image: ghcr.io/esphome/esphome:stable
    volumes:
      - ./esphome/config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Australia/Sydney
      - ESPHOME_DASHBOARD_USE_PING=false
    restart: unless-stopped
    privileged: true
    network_mode: host

  # ============================================================================
  # SCRYPTED
  # ============================================================================
  # Access: https://<host-ip>:10443 (self-signed cert)
  # Full discovery works with host networking
  scrypted:
    container_name: scrypted
    image: ghcr.io/koush/scrypted:latest
    volumes:
      - ./scrypted/volume:/server/volume
      # NVR storage - uncomment and set path:
      # - /path/to/nvr/storage:/nvr
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Australia/Sydney
      # Uncomment for NVR:
      # - SCRYPTED_NVR_VOLUME=/nvr
      - SCRYPTED_WEBHOOK_UPDATE_AUTHORIZATION=${SCRYPTED_WEBHOOK_UPDATE_AUTHORIZATION}
      - SCRYPTED_WEBHOOK_UPDATE=http://localhost:10444/v1/update
    restart: unless-stopped
    network_mode: host
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.centurylinklabs.watchtower.scope=scrypted"

  # ============================================================================
  # CLOUDFLARED (Cloudflare Tunnel)
  # ============================================================================
  # Setup:
  # 1. Create tunnel: Cloudflare Zero Trust > Networks > Tunnels
  # 2. Add token to .env: CLOUDFLARE_TUNNEL_TOKEN=eyJ...
  # 3. Configure hostname in CF dashboard: http://localhost:8123
  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    network_mode: host
    depends_on:
      - homeassistant

  # ============================================================================
  # WATCHTOWER (Auto-updates for Scrypted)
  # ============================================================================
  watchtower:
    container_name: scrypted-watchtower
    image: containrrr/watchtower:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_HTTP_API_TOKEN:-scrypted-update-token}
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_SCOPE=scrypted
      - WATCHTOWER_HTTP_API_PERIODIC_POLLS=true
      - WATCHTOWER_CLEANUP=true
    restart: unless-stopped
    ports:
      - "10444:8080"
    labels:
      - "com.centurylinklabs.watchtower.scope=scrypted"
    command: --interval 3600 --cleanup --scope scrypted

