# Washer/dryer cycle detection.
#
# Thresholds are helpers so they can be tuned from the UI without a redeploy.
# Values derived from long-term statistics (hourly mean/min/max, Sep 2025 ->
# Jul 2026), not raw states - the July 2026 macOS TCP outage destroyed the
# 10-day raw history window.
#
#            idle mean  idle max  active max p50  active mean p10  typical cycle
#   washer   0.00 W     2.88 W    1930 W          12 W             2 h
#   dryer    0.00 W     0.17 W     666 W         128 W             2-5 h
#
# Idle is a clean 0 W on both, so stop=5 W sits far above noise and far below
# any real load, and start=20 W is far below the p10 active max (222/231 W).
# The washer's active hours can average just 12 W, which means long near-zero
# soak stretches inside a cycle - hence its much longer stop debounce. The
# dryer is a heat-pump model (peak ~750 W, not 2-3 kW) that runs continuously.

# NOTE ON `initial:` - deliberately absent.
#
# Setting `initial:` on an input_select or input_number makes HA FORCE that
# value on every restart, overriding normal state restoration. On 2026-07-28
# this silently broke the state machine: several deploys restarted HA
# mid-cycle, each one resetting washer_state from `running` back to `idle`, so
# the finish automation's `state == running` condition failed and no
# notification ever fired. One cycle missed by two minutes.
#
# Without `initial:` these helpers restore their previous value across
# restarts, which is what a state machine and user-tuned thresholds both need.

input_number:
  washer_start_threshold:
    name: Washer start threshold
    min: 1
    max: 500
    step: 1
    unit_of_measurement: W
    icon: mdi:washing-machine
  washer_stop_threshold:
    name: Washer stop threshold
    min: 1
    max: 200
    step: 1
    unit_of_measurement: W
    icon: mdi:washing-machine-off
  washer_stop_minutes:
    name: Washer stop debounce
    min: 1
    max: 60
    step: 1
    unit_of_measurement: min
    icon: mdi:timer-sand
  dryer_start_threshold:
    name: Dryer start threshold
    min: 1
    max: 500
    step: 1
    unit_of_measurement: W
    icon: mdi:tumble-dryer
  dryer_stop_threshold:
    name: Dryer stop threshold
    min: 1
    max: 200
    step: 1
    unit_of_measurement: W
    icon: mdi:tumble-dryer-off
  dryer_stop_minutes:
    name: Dryer stop debounce
    min: 1
    max: 60
    step: 1
    unit_of_measurement: min
    icon: mdi:timer-sand
  washer_cycle_start_energy:
    name: Washer cycle start energy
    min: 0
    max: 1000000
    step: 0.0001
    unit_of_measurement: kWh
    mode: box
  dryer_cycle_start_energy:
    name: Dryer cycle start energy
    min: 0
    max: 1000000
    step: 0.0001
    unit_of_measurement: kWh
    mode: box

input_datetime:
  washer_cycle_start:
    name: Washer cycle start
    has_date: true
    has_time: true
  dryer_cycle_start:
    name: Dryer cycle start
    has_date: true
    has_time: true
  # The END of a cycle has to be recorded explicitly. It used to be inferred
  # from input_select.<x>_state.last_changed, but HA resets last_changed to the
  # restart time on every restart, so the duration inflated with every deploy -
  # the dryer showed 1882 min for a cycle that really took 353. An
  # input_datetime survives restarts; last_changed does not.
  washer_cycle_end:
    name: Washer cycle end
    has_date: true
    has_time: true
  dryer_cycle_end:
    name: Dryer cycle end
    has_date: true
    has_time: true

input_select:
  washer_state:
    name: Washer state
    options:
      - idle
      - running
      - finished
    icon: mdi:washing-machine
  dryer_state:
    name: Dryer state
    options:
      - idle
      - running
      - finished
    icon: mdi:tumble-dryer

# ---------------------------------------------------------------------------
# Cycle history. "Last cycle only" - longer history lives in the recorder and
# the Phase 2 power-signature charts.
# ---------------------------------------------------------------------------
template:
  - sensor:
      - name: Washer last cycle duration
        unique_id: washer_last_cycle_duration
        icon: mdi:timer-outline
        unit_of_measurement: min
        # Sensors declaring a unit must hold a NUMBER. Returning the string
        # "unknown" fails HA's validator, so absence is expressed via
        # availability instead. cycle_start_energy is 0 until a real cycle runs.
        #
        # end > start is also required. While a new cycle is RUNNING, cycle_start
        # has already moved but cycle_end still holds the previous cycle's, so the
        # pair no longer describes one cycle and the subtraction goes negative.
        # Reporting 0 min there looks like a real measurement; unavailable is
        # honest. The cycle history sensors below keep the completed record.
        availability: >
          {{ states('input_number.washer_cycle_start_energy') | float(0) > 0
              and states('input_datetime.washer_cycle_start') not in
                  ['unknown', 'unavailable', '']
              and states('input_datetime.washer_cycle_end') not in
                  ['unknown', 'unavailable', '']
              and as_timestamp(states('input_datetime.washer_cycle_end'))
                  > as_timestamp(states('input_datetime.washer_cycle_start')) }}
        state: >
          {% set m = ((as_timestamp(states('input_datetime.washer_cycle_end'))
                      - as_timestamp(states('input_datetime.washer_cycle_start'))) / 60) | round(0) %}
          {{ m if m >= 0 else 0 }}

      - name: Washer last cycle energy
        unique_id: washer_last_cycle_energy
        icon: mdi:lightning-bolt
        device_class: energy
        unit_of_measurement: kWh
        availability: >
          {{ states('input_number.washer_cycle_start_energy') | float(0) > 0 }}
        state: >
          {% set e0 = states('input_number.washer_cycle_start_energy') | float(0) %}
          {% set d = (states('sensor.power_monitor_3_f257d8_f257d8_total_energy') | float(0)) - e0 %}
          {{ (d if d > 0 else 0) | round(3) }}

      - name: Dryer last cycle duration
        unique_id: dryer_last_cycle_duration
        icon: mdi:timer-outline
        unit_of_measurement: min
        # Sensors declaring a unit must hold a NUMBER. Returning the string
        # "unknown" fails HA's validator, so absence is expressed via
        # availability instead. cycle_start_energy is 0 until a real cycle runs.
        #
        # end > start is also required. While a new cycle is RUNNING, cycle_start
        # has already moved but cycle_end still holds the previous cycle's, so the
        # pair no longer describes one cycle and the subtraction goes negative.
        # Reporting 0 min there looks like a real measurement; unavailable is
        # honest. The cycle history sensors below keep the completed record.
        availability: >
          {{ states('input_number.dryer_cycle_start_energy') | float(0) > 0
              and states('input_datetime.dryer_cycle_start') not in
                  ['unknown', 'unavailable', '']
              and states('input_datetime.dryer_cycle_end') not in
                  ['unknown', 'unavailable', '']
              and as_timestamp(states('input_datetime.dryer_cycle_end'))
                  > as_timestamp(states('input_datetime.dryer_cycle_start')) }}
        state: >
          {% set m = ((as_timestamp(states('input_datetime.dryer_cycle_end'))
                      - as_timestamp(states('input_datetime.dryer_cycle_start'))) / 60) | round(0) %}
          {{ m if m >= 0 else 0 }}

      - name: Dryer last cycle energy
        unique_id: dryer_last_cycle_energy
        icon: mdi:lightning-bolt
        device_class: energy
        unit_of_measurement: kWh
        availability: >
          {{ states('input_number.dryer_cycle_start_energy') | float(0) > 0 }}
        state: >
          {% set e0 = states('input_number.dryer_cycle_start_energy') | float(0) %}
          {% set d = (states('sensor.power_monitor_4_f27381_total_energy') | float(0)) - e0 %}
          {{ (d if d > 0 else 0) | round(3) }}

  # -----------------------------------------------------------------------
  # Cycle history: one record per completed cycle, appended to this sensor's own
  # attributes, keeping the last 40.
  #
  # Duration and energy are computed inline from the input_datetime/input_number
  # helpers rather than read from sensor.<x>_last_cycle_duration/energy. Those
  # are ordinary template sensors updating asynchronously, so reading them from
  # a template firing on the same state change is a race - it would record the
  # PREVIOUS cycle's numbers.
  #
  # NOTE these are extra items in the SAME `template:` list above. A second
  # top-level `template:` key would silently replace the first, since YAML lets
  # the later duplicate win - that would delete the four sensors above.
  #
  # This accumulates only from deployment; earlier cycles are not backfilled.
  # The recorder still holds them, so the Laundry tab also carries a logbook.
  - trigger:
      - trigger: state
        entity_id: input_select.washer_state
        to: finished
    sensor:
      - name: Washer cycle history
        unique_id: washer_cycle_history
        icon: mdi:washing-machine
        state: "{{ (this.attributes.get('cycles', []) | length) + 1 }}"
        attributes:
          cycles: >
            {% set st = states('input_datetime.washer_cycle_start') %}
            {% set en = states('input_datetime.washer_cycle_end') %}
            {% set ok = st not in ['unknown','unavailable',''] and en not in ['unknown','unavailable',''] %}
            {% set mins = (((as_timestamp(en) - as_timestamp(st)) / 60) | round(0)) if ok else 0 %}
            {% set kwh = ((states('sensor.power_monitor_3_f257d8_f257d8_total_energy') | float(0))
                          - (states('input_number.washer_cycle_start_energy') | float(0))) | round(3) %}
            {% set rec = {'start': st, 'end': en,
                          'mins': (mins if mins > 0 else 0),
                          'kwh': (kwh if kwh > 0 else 0)} %}
            {{ (this.attributes.get('cycles', []) + [rec])[-40:] }}

  - trigger:
      - trigger: state
        entity_id: input_select.dryer_state
        to: finished
    sensor:
      - name: Dryer cycle history
        unique_id: dryer_cycle_history
        icon: mdi:tumble-dryer
        state: "{{ (this.attributes.get('cycles', []) | length) + 1 }}"
        attributes:
          cycles: >
            {% set st = states('input_datetime.dryer_cycle_start') %}
            {% set en = states('input_datetime.dryer_cycle_end') %}
            {% set ok = st not in ['unknown','unavailable',''] and en not in ['unknown','unavailable',''] %}
            {% set mins = (((as_timestamp(en) - as_timestamp(st)) / 60) | round(0)) if ok else 0 %}
            {% set kwh = ((states('sensor.power_monitor_4_f27381_total_energy') | float(0))
                          - (states('input_number.dryer_cycle_start_energy') | float(0))) | round(3) %}
            {% set rec = {'start': st, 'end': en,
                          'mins': (mins if mins > 0 else 0),
                          'kwh': (kwh if kwh > 0 else 0)} %}
            {{ (this.attributes.get('cycles', []) + [rec])[-40:] }}

# ---------------------------------------------------------------------------
# State machine: idle -> running -> finished -> idle
#
# "finished" requires power below the stop threshold CONTINUOUSLY for the
# debounce window. That continuity requirement is what stops soak and pause
# phases firing a false completion.
# ---------------------------------------------------------------------------
automation:
  # ----------------------------- WASHER -----------------------------
  - id: laundry_washer_start
    alias: "Laundry: washer started"
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.power_monitor_3_f257d8_f257d8_power
        above: input_number.washer_start_threshold
        for: "00:01:00"
    conditions:
      - condition: not
        conditions:
          - condition: state
            entity_id: input_select.washer_state
            state: running
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.washer_state
        data:
          option: running
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.washer_cycle_start
        data:
          timestamp: "{{ now().timestamp() }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.washer_cycle_start_energy
        data:
          value: "{{ states('sensor.power_monitor_3_f257d8_f257d8_total_energy') | float(0) }}"

  - id: laundry_washer_finished
    alias: "Laundry: washer finished"
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.power_monitor_3_f257d8_f257d8_power
        below: input_number.washer_stop_threshold
        for:
          minutes: "{{ states('input_number.washer_stop_minutes') | int(15) }}"
    conditions:
      - condition: state
        entity_id: input_select.washer_state
        state: running
    actions:
      # Compute BEFORE the state change. Template sensors update
      # asynchronously, so reading sensor.washer_last_cycle_* here would race
      # and could report a stale value.
      - variables:
          dur: >-
            {% set s = states('input_datetime.washer_cycle_start') %}
            {% if s in ['unknown','unavailable',''] %}?{% else %}{{ ((now().timestamp() - as_timestamp(s)) / 60) | round(0) }}{% endif %}
          kwh: >-
            {{ (((states('sensor.power_monitor_3_f257d8_f257d8_total_energy') | float(0)) - (states('input_number.washer_cycle_start_energy') | float(0))) | round(3)) }}
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.washer_cycle_end
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.washer_state
        data:
          option: finished
      - action: notify.mobile_app_nicks_iphone
        data:
          title: "Washing machine finished"
          message: "Took {{ dur }} min, used {{ kwh }} kWh."
          data:
            tag: laundry_washer
            group: laundry
      - action: notify.mobile_app_iphone
        data:
          title: "Washing machine finished"
          message: "Took {{ dur }} min, used {{ kwh }} kWh."
          data:
            tag: laundry_washer
            group: laundry

  - id: laundry_washer_reset
    alias: "Laundry: washer back to idle"
    mode: single
    # A `for:` on a state trigger is NOT restart-proof - HA resets last_changed
    # to the restart time, so the countdown starts again and on a day of frequent
    # deploys it never elapses. The washer sat in `finished` for over a day because
    # of exactly that. Polling against the recorded end time survives restarts.
    triggers:
      - trigger: time_pattern
        minutes: "/15"
    conditions:
      - condition: state
        entity_id: input_select.washer_state
        state: finished
      - condition: template
        value_template: >
          {% set e = states('input_datetime.washer_cycle_end') %}
          {{ e not in ['unknown','unavailable','']
             and (now().timestamp() - as_timestamp(e)) > 21600 }}
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.washer_state
        data:
          option: idle

  # ----------------------------- DRYER ------------------------------
  - id: laundry_dryer_start
    alias: "Laundry: dryer started"
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.power_monitor_4_f27381_power
        above: input_number.dryer_start_threshold
        for: "00:01:00"
    conditions:
      - condition: not
        conditions:
          - condition: state
            entity_id: input_select.dryer_state
            state: running
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.dryer_state
        data:
          option: running
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.dryer_cycle_start
        data:
          timestamp: "{{ now().timestamp() }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.dryer_cycle_start_energy
        data:
          value: "{{ states('sensor.power_monitor_4_f27381_total_energy') | float(0) }}"

  - id: laundry_dryer_finished
    alias: "Laundry: dryer finished"
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.power_monitor_4_f27381_power
        below: input_number.dryer_stop_threshold
        for:
          minutes: "{{ states('input_number.dryer_stop_minutes') | int(10) }}"
    conditions:
      - condition: state
        entity_id: input_select.dryer_state
        state: running
    actions:
      - variables:
          dur: >-
            {% set s = states('input_datetime.dryer_cycle_start') %}
            {% if s in ['unknown','unavailable',''] %}?{% else %}{{ ((now().timestamp() - as_timestamp(s)) / 60) | round(0) }}{% endif %}
          kwh: >-
            {{ (((states('sensor.power_monitor_4_f27381_total_energy') | float(0)) - (states('input_number.dryer_cycle_start_energy') | float(0))) | round(3)) }}
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.dryer_cycle_end
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.dryer_state
        data:
          option: finished
      - action: notify.mobile_app_nicks_iphone
        data:
          title: "Dryer finished"
          message: "Took {{ dur }} min, used {{ kwh }} kWh."
          data:
            tag: laundry_dryer
            group: laundry
      - action: notify.mobile_app_iphone
        data:
          title: "Dryer finished"
          message: "Took {{ dur }} min, used {{ kwh }} kWh."
          data:
            tag: laundry_dryer
            group: laundry

  - id: laundry_dryer_reset
    alias: "Laundry: dryer back to idle"
    mode: single
    # A `for:` on a state trigger is NOT restart-proof - HA resets last_changed
    # to the restart time, so the countdown starts again and on a day of frequent
    # deploys it never elapses. The dryer sat in `finished` for over a day because
    # of exactly that. Polling against the recorded end time survives restarts.
    triggers:
      - trigger: time_pattern
        minutes: "/15"
    conditions:
      - condition: state
        entity_id: input_select.dryer_state
        state: finished
      - condition: template
        value_template: >
          {% set e = states('input_datetime.dryer_cycle_end') %}
          {{ e not in ['unknown','unavailable','']
             and (now().timestamp() - as_timestamp(e)) > 21600 }}
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.dryer_state
        data:
          option: idle
