# Derived live solar power.
#
# WHY THIS EXISTS
# ---------------
# The inverter does not populate its PV telemetry registers. Read directly over
# Modbus (holding registers 0x0584-0x0589) it reports PV1 1.7 V / 0.06 A and
# PV2 1.9 V / 0.00 A in full sun while the array is demonstrably producing kilowatts.
# This is the inverter, not our register map: sofar_g3.yaml and sofar_g3hyd.yaml use
# identical addresses for that block, and a sweep of the entire 0x0000-0x0800 map on
# 2026-07-29 found no alternative PV block holding a live string voltage.
#
# So sensor.inverter_pv_power, pv1_power and pv2_power all sit at 0 W permanently,
# which made the dashboard claim the whole house was running on grid import at 8am
# with the sun up.
#
# WHAT IS TRUSTWORTHY
# -------------------
# The load, grid and battery registers are sound. Proven overnight, when PV is
# necessarily zero: load + grid + battery landed within -50..0 W of zero at every
# hour from 00:30 to 05:00 on 2026-07-29. So the balance equation closes, and any
# residual during daylight is the missing PV term:
#
#     PV = load_power + grid_power + battery_power
#
# Sign conventions (both confirmed against real data):
#   grid_power    positive = exporting, negative = importing
#   battery_power positive = charging,  negative = discharging
#
# Validated in both directions:
#   2026-07-29 08:12  load 3412  grid -1805  batt   -8  ->  1599 W
#                     ...against today_production rising at 1607 W. Agrees to 0.5%.
#   2026-07-28 16:13  load  460  grid +2270  batt    0  ->  2730 W
#                     ...exporting 2270 W while serving a 460 W load. Correct.
#
# The Energy Dashboard is NOT affected and must stay on sensor.inverter_total_production
# (state_class total_increasing). That counter is accurate — it was the only reason we
# could tell the array was working at all. This sensor is for live display only.
#
# If the inverter ever starts reporting its PV registers again, this stays correct;
# it is derived from the balance, not from the broken registers.

template:
  - sensor:
      - name: Solar PV power
        unique_id: solar_pv_power_derived
        device_class: power
        state_class: measurement
        unit_of_measurement: W
        icon: mdi:solar-power-variant
        availability: >-
          {{ [states('sensor.inverter_load_power'),
              states('sensor.inverter_grid_power'),
              states('sensor.inverter_battery_power')]
             | map('is_number') | min }}
        state: >-
          {% set pv = states('sensor.inverter_load_power')    | float
                    + states('sensor.inverter_grid_power')    | float
                    + states('sensor.inverter_battery_power') | float %}
          {{ [pv, 0] | max | round(-1) | int }}
        attributes:
          # Surfaced so the derivation is visible in the UI when it looks wrong.
          derivation: >-
            load {{ states('sensor.inverter_load_power') }}W
            + grid {{ states('sensor.inverter_grid_power') }}W
            + battery {{ states('sensor.inverter_battery_power') }}W
