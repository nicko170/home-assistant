# MSB (main switchboard) meter — EARU EASEM-D, 16 sub-circuits.
#
# TRUST NOTES — read before building anything else on this device
# ---------------------------------------------------------------
# The 16 SUB-CIRCUIT channels are accurate and independently verified. On
# 2026-07-29 their sum was checked against the inverter's load register across a
# 3.5x swing in house load:
#     heater on   subs 1790 W  vs  inverter load 1830 W   (-2%)
#     heater off  subs  484 W  vs  inverter load  510 W   (-5%)
# sub10 went 1309 W -> 13 W at the moment of that drop, so sub10 is the aircon.
#
# The MAIN channels (A/B/C) are NOT trustworthy and nothing here uses them:
#   - meter_type (dps 108) is "1_phase", so the meter zeroes B and C entirely.
#     Raw dps 102/103 are literally 01 00 00 ... - voltage 0.1 V, current 0.
#     The solar/battery CTs on B and C therefore read nothing until the meter is
#     switched to 3-phase mode.
#   - Phase A does not correlate with grid, load, PV or battery. It sat at a flat
#     ~1200 W while the whole house dropped to 510 W, which is impossible for a
#     real house circuit. Needs verification at the switchboard.
#   - The per-phase "power" field in the payload is not apparent power either:
#     V x I / P_a drifted 19.5 -> 26.5 over a two-minute sample, so it is not a
#     fixed scale error. Use V x I, or better, use the subs.
#
# CIRCUIT IDENTIFICATION — fill these in as they get traced at the switchboard.
#   sub01  LIGHT 1 (confirmed)     sub09  ? (idle)
#   sub02  LIGHT 2 (confirmed)     sub10  AIRCON   (confirmed 2026-07-29)
#   sub03  LIGHT 3 (unconfirmed)   sub11  ? (idle)
#   sub04  ? (idle)              sub12  STOVE (confirmed 2026-07-30)
#   sub05  LAUNDRY (r=0.97)      sub13  ? (idle)
#   sub06  ?                     sub14  ? (idle)
#   sub07  KITCHEN (confirmed)      sub15  WATER PUMP (confirmed)
#   sub08  ? (idle)              sub16  HOT WATER (heat pump, confirmed 2026-07-30)
#
# Lighting circuits, 2026-07-30, by switching every light in the house off:
#   sub01 fell 12 -> 0 W. Exactly zero, so that circuit is lighting and nothing
#         else. Confirmed.
#   sub02 fell 111 -> 37 W. Confirmed lighting; the ~37 W residue is the ensuite
#         light left deliberately on. That also explains its daytime-heavy shape -
#         it carries interior rooms used in daylight, which initially looked
#         backwards for lighting.
#   sub03 did NOT move - it was already at 3 W before the test, so it proved
#         nothing. Its profile (off 66% of the time, peaks at midday and 18:00) is
#         consistent with lighting but UNPROVEN. Re-test by switching it during
#         the day, when it is actually drawing.
#
# sub12 is the STOVE. On 2026-07-30 it ran 17:11-17:36 and at no other point in
# the day, cycling ~30s on / 30s off at a 63% duty, and its power while running was
# effectively a single value: 1850 W x30 samples, with 1800/1900/1950 stragglers.
# One fixed wattage plus zero standby draw means a hardwired resistive element on
# a thermostat. Peak was only 1928 W though, i.e. one element's worth - so this may
# be specifically the oven rather than a whole oven+cooktop unit. To settle it, run
# two cooktop elements at once: sub12 should roughly double to ~3.7 kW if the
# cooktop is on this circuit.
#
# sub07 is the KITCHEN, not the stove, despite also being busy at dinner. It holds
# a permanent 40-50 W standby and several discrete levels - 670 / 1212 / 1800 /
# 2280 W - with bursts at lunch, dinner and 19:30, because it feeds several
# appliances (microwave, dishwasher and so on). The 18:41-18:44 burst at
# 2050-2284 W for 2.75 min is the kettle. Its standby floor is the appliance
# clocks, which is why this circuit never reads zero.
#
# sub15 is the WATER PUMP - the rainwater tank pump that serves the toilets.
# Signature is short ~700-740 W bursts of 30-45 s, on demand: 15:55, 16:30, 18:16,
# 18:29, 18:37, 18:43, 19:20, 21:42. Bursts that brief and that regular in
# amplitude are a pump reaching cut-out pressure, and their timing tracks water
# use rather than any schedule.
#
# sub05 was identified by correlating each circuit against the washing machine's
# own plug monitor over a 45 min window: r = 0.97 on deltas, every other circuit
# below 0.1. sub10 was identified by watching it fall 1309 W -> 13 W at the exact
# moment the whole-house load dropped by the same amount.
#
# sub05 is the LAUNDRY circuit and the washer and dryer hang off it, each with
# its own plug monitor. Those two are registered in the Energy Dashboard with
# `included_in_stat: sensor.msb_meter_energy_sub05` so HA nests them under
# Laundry instead of double counting their kWh. If another sub-metered appliance
# is ever added, do the same for it.
#
# WHEN RENAMING A CIRCUIT: change the utility_meter key AND its name together, as
# done for laundry/aircon below. The key and the slugified name must stay equal,
# otherwise the entity_id depends on which one HA happens to derive it from.

template:
  - sensor:
      # Whole-house load measured at the switchboard, summed from the 16 subs.
      # This is the trustworthy total - see the note above about power_total.
      - name: Circuits total power
        unique_id: msb_circuits_total_power
        device_class: power
        state_class: measurement
        unit_of_measurement: W
        icon: mdi:home-lightning-bolt
        # Available as long as at least one circuit is reporting, so a single
        # dropped channel does not blank the whole-house figure.
        availability: >-
          {% set ns = namespace(ok = false) %}
          {% for i in range(1, 17) %}
            {% if states('sensor.msb_meter_power_sub' ~ '%02d' | format(i)) | is_number %}
              {% set ns.ok = true %}
            {% endif %}
          {% endfor %}
          {{ ns.ok }}
        state: >-
          {% set ns = namespace(t = 0.0) %}
          {% for i in range(1, 17) %}
            {% set e = 'sensor.msb_meter_power_sub' ~ '%02d' | format(i) %}
            {% if states(e) | is_number %}
              {% set ns.t = ns.t + states(e) | float(0) %}
            {% endif %}
          {% endfor %}
          {{ (ns.t * 1000) | round(0) | int }}

      # Directional split of grid and battery, so the sankey can draw one-way
      # flows. Sign conventions are the ones proven in packages/solar.yaml:
      #   grid    positive = exporting, negative = importing
      #   battery positive = charging,  negative = discharging
      - name: Flow grid import
        unique_id: flow_grid_import
        device_class: power
        state_class: measurement
        unit_of_measurement: W
        availability: "{{ states('sensor.inverter_grid_power') | is_number }}"
        state: "{{ [ -(states('sensor.inverter_grid_power') | float), 0 ] | max | round(0) | int }}"

      - name: Flow grid export
        unique_id: flow_grid_export
        device_class: power
        state_class: measurement
        unit_of_measurement: W
        availability: "{{ states('sensor.inverter_grid_power') | is_number }}"
        state: "{{ [ states('sensor.inverter_grid_power') | float, 0 ] | max | round(0) | int }}"

      - name: Flow battery charge
        unique_id: flow_battery_charge
        device_class: power
        state_class: measurement
        unit_of_measurement: W
        availability: "{{ states('sensor.inverter_battery_power') | is_number }}"
        state: "{{ [ states('sensor.inverter_battery_power') | float, 0 ] | max | round(0) | int }}"

      - name: Flow battery discharge
        unique_id: flow_battery_discharge
        device_class: power
        state_class: measurement
        unit_of_measurement: W
        availability: "{{ states('sensor.inverter_battery_power') | is_number }}"
        state: "{{ [ -(states('sensor.inverter_battery_power') | float), 0 ] | max | round(0) | int }}"

# Daily kWh per circuit. The meter's own energy_subNN counters are lifetime
# total_increasing values, which are right for the Energy Dashboard but useless
# for a "today" card - these give a clean per-day figure that resets at midnight.
# In every entry the key and the slugified name are deliberately identical, so
# the entity_id is predictable regardless of which one HA derives it from.
utility_meter:
  light_1: {source: sensor.msb_meter_energy_sub01, name: Light 1, cycle: daily}
  light_2: {source: sensor.msb_meter_energy_sub02, name: Light 2, cycle: daily}
  light_3: {source: sensor.msb_meter_energy_sub03, name: Light 3, cycle: daily}
  circuit_04: {source: sensor.msb_meter_energy_sub04, name: Circuit 04, cycle: daily}
  laundry: {source: sensor.msb_meter_energy_sub05, name: Laundry, cycle: daily}
  # The washer and dryer sit on the laundry circuit and each has its own plug
  # monitor, but ESPHome only exposes a lifetime `total_energy` and a
  # `total_energy_since_boot` that resets on reboot rather than at midnight.
  # Neither belongs on a "today" card, so they get daily meters of their own.
  # These are for display only - the Energy Dashboard still uses the lifetime
  # counters, nested under Laundry via included_in_stat.
  washing_machine: {source: sensor.power_monitor_3_f257d8_f257d8_total_energy, name: Washing machine, cycle: daily}
  dryer: {source: sensor.power_monitor_4_f27381_total_energy, name: Dryer, cycle: daily}
  circuit_06: {source: sensor.msb_meter_energy_sub06, name: Circuit 06, cycle: daily}
  kitchen: {source: sensor.msb_meter_energy_sub07, name: Kitchen, cycle: daily}
  circuit_08: {source: sensor.msb_meter_energy_sub08, name: Circuit 08, cycle: daily}
  circuit_09: {source: sensor.msb_meter_energy_sub09, name: Circuit 09, cycle: daily}
  aircon: {source: sensor.msb_meter_energy_sub10, name: Aircon, cycle: daily}
  circuit_11: {source: sensor.msb_meter_energy_sub11, name: Circuit 11, cycle: daily}
  stove: {source: sensor.msb_meter_energy_sub12, name: Stove, cycle: daily}
  circuit_13: {source: sensor.msb_meter_energy_sub13, name: Circuit 13, cycle: daily}
  circuit_14: {source: sensor.msb_meter_energy_sub14, name: Circuit 14, cycle: daily}
  water_pump: {source: sensor.msb_meter_energy_sub15, name: Water pump, cycle: daily}
  hot_water: {source: sensor.msb_meter_energy_sub16, name: Hot water, cycle: daily}
