# TEMPORARY firmware - GPIO discovery only.
#
# The original HomeSpan sketch was lost, so which pin drives the door relay is
# unknown. This build exposes every plausible candidate as a switch plus a web
# UI, so the pin can be found by ear.
#
# Every switch is MOMENTARY: on_turn_on immediately schedules its own turn_off
# after 400ms. A wrong guess therefore cannot hold an output high. Garage
# openers take a button press, not a held contact.
#
# Excluded deliberately:
#   GPIO 6-11   SPI flash lines - driving these crashes the chip
#   GPIO 34-39  input only, cannot drive a relay
#   GPIO 0, 12  strapping pins, change boot behaviour
#
# Replaced by garage-door.yaml once the pin is known.

esphome:
  name: garage-door
  friendly_name: Garage Door

esp32:
  # HomeSpan's mDNS reported board=esp32da, which is Arduino's name for the
  # dual-antenna ESP32-WROOM-DA. ESPHome/PlatformIO does not know that name;
  # the silicon is a plain ESP32, so the generic esp32dev board is correct
  # (same as the Actron controller config).
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG

api:
  encryption:
    key: !secret garage_api_key

ota:
  - platform: esphome
    password: !secret garage_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  manual_ip:
    static_ip: 192.168.15.17
    gateway: 192.168.15.1
    subnet: 255.255.255.0
    dns1: 192.168.15.1

# Web UI for toggling pins by hand during discovery.
web_server:
  port: 80

switch:
  - platform: gpio
    pin: 4
    name: "Pin 04"
    id: pin_04
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - delay: 400ms
      - switch.turn_off: pin_04
