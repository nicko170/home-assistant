# Overview - home at a glance.
# Sections view (native grid layout). Deliberately short: this is the "is
# everything OK" screen, with detail living on Power / Cameras / Admin.

views:
  - title: Home
    path: home
    type: sections
    max_columns: 3
    icon: mdi:home
    badges:
      - type: entity
        entity: person.admin
        name: Nick
      - type: entity
        entity: person.elle_gallo
        name: Elle
      - type: entity
        entity: sensor.inverter_battery
        name: Battery
        color: >-
          {{ 'green' if states('sensor.inverter_battery')|float(0) > 50
             else 'orange' if states('sensor.inverter_battery')|float(0) > 20
             else 'red' }}
      - type: entity
        entity: sensor.solar_pv_power
        name: Solar
      - type: entity
        entity: sensor.inverter_load_power
        name: House
      - type: entity
        entity: weather.forecast_home

    sections:
      # ---------------------------------------------------------------
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Power right now
            heading_style: title
            icon: mdi:transmission-tower

          - type: custom:power-flow-card-plus
            entities:
              battery:
                entity: sensor.inverter_battery_power
                state_of_charge: sensor.inverter_battery
                invert_state: true
              grid:
                entity: sensor.inverter_grid_power
                invert_state: true
              solar:
                entity: sensor.solar_pv_power
                display_zero_state: true
              home:
                entity: sensor.inverter_load_power
            clickable_entities: true
            display_zero_lines:
              mode: show
            use_new_flow_rate_model: true
            w_decimals: 0
            kw_decimals: 2
            watt_threshold: 1000

          - type: tile
            entity: sensor.battery_remaining_energy
            name: Battery stored
            icon: mdi:battery-charging-70
            features:
              - type: trend-graph

          # Runtime alongside the stored figure - kWh on its own does not answer
          # "will it get us through the night". battery_time_to_empty divides
          # remaining usable energy by the CURRENT discharge rate, so it moves
          # about a lot when load does; the load-coverage figure below assumes
          # the present house load continues instead.
          - type: custom:mushroom-template-card
            primary: >-
              {% set soc = states('sensor.inverter_battery') | float(0) %}
              {% set kwh = states('sensor.battery_remaining_energy') | float(0) %}
              {{ '%.1f' | format(kwh) }} kWh left, {{ soc | round(0) }}%
            secondary: >-
              {% set p = states('sensor.inverter_battery_power') | float(0) %}
              {% if p > 20 %}Charging at {{ (p / 1000) | round(1) }} kW
              {% elif p < -20 %}{{ states('sensor.battery_time_to_empty') }} at
                {{ (p / -1000) | round(1) }} kW
              {% else %}Idle - {{ states('sensor.battery_load_coverage_time') }} at current load
              {% endif %}
            icon: >-
              {% set p = states('sensor.inverter_battery_power') | float(0) %}
              {% if p > 20 %}mdi:battery-charging
              {% elif p < -20 %}mdi:battery-arrow-down
              {% else %}mdi:battery{% endif %}
            icon_color: >-
              {% set soc = states('sensor.inverter_battery') | float(0) %}
              {% if soc > 60 %}green{% elif soc > 30 %}orange{% else %}red{% endif %}
            entity: sensor.battery_time_to_empty

      # ---------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Laundry
            heading_style: title
            icon: mdi:washing-machine

          - type: custom:mushroom-template-card
            primary: Washing machine
            secondary: >-
              {% set s = states('input_select.washer_state') %}
              {% if s == 'running' %}Running
              {%- elif s == 'finished' %}Finished - {{ states('sensor.washer_last_cycle_duration') }} min, {{ states('sensor.washer_last_cycle_energy') }} kWh
              {%- else %}Idle{% endif %}
            icon: mdi:washing-machine
            icon_color: >-
              {% set s = states('input_select.washer_state') %}
              {{ 'blue' if s == 'running' else 'green' if s == 'finished' else 'grey' }}
            badge_icon: >-
              {{ 'mdi:check' if states('input_select.washer_state') == 'finished' else '' }}
            tap_action:
              action: more-info
              entity: sensor.power_monitor_3_f257d8_f257d8_power

          - type: custom:mushroom-template-card
            primary: Dryer
            secondary: >-
              {% set s = states('input_select.dryer_state') %}
              {% if s == 'running' %}Running
              {%- elif s == 'finished' %}Finished - {{ states('sensor.dryer_last_cycle_duration') }} min, {{ states('sensor.dryer_last_cycle_energy') }} kWh
              {%- else %}Idle{% endif %}
            icon: mdi:tumble-dryer
            icon_color: >-
              {% set s = states('input_select.dryer_state') %}
              {{ 'blue' if s == 'running' else 'green' if s == 'finished' else 'grey' }}
            tap_action:
              action: more-info
              entity: sensor.power_monitor_4_f27381_power

          - type: custom:mini-graph-card
            name: Laundry power
            hours_to_show: 12
            points_per_hour: 12
            line_width: 2
            entities:
              - entity: sensor.power_monitor_3_f257d8_f257d8_power
                name: Washer
              - entity: sensor.power_monitor_4_f27381_power
                name: Dryer
            show:
              fill: fade
              labels: true

      # ---------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Front door
            heading_style: title
            icon: mdi:doorbell-video

          - type: picture-entity
            entity: camera.doorbell_fluent
            camera_view: auto
            show_name: false
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /home-cameras/live

          - type: tile
            entity: binary_sensor.doorbell_visitor
            name: Doorbell pressed
            icon: mdi:bell-ring

          - type: tile
            entity: binary_sensor.doorbell_person
            name: Person at door
            icon: mdi:account

      # ---------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Garage
            heading_style: title
            icon: mdi:garage

          - type: tile
            entity: cover.garage_door_door
            name: Garage door
            features:
              - type: cover-open-close

          - type: tile
            entity: binary_sensor.garage_door_position
            name: Door sensor

          # Environment and health from the BTHome door sensor. Battery and
          # voltage matter because a flat sensor means the cover silently
          # reports a stale position.
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.garage_temperature
                name: Temperature
              - entity: sensor.garage_humidity
                name: Humidity
              - entity: sensor.garage_battery
                name: Sensor battery
              - entity: sensor.garage_voltage
                name: Sensor voltage

          # NOTE: the camera actually overlooking the garage is the .244
          # Hikvision, despite .242 self-reporting its channel name as
          # "Garage". The device names are misleading - see Admin.
          - type: picture-entity
            entity: camera.garage_right_mainstream
            camera_view: auto
            show_name: false
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /home-cameras/live

      # ---------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Environment
            heading_style: title
            icon: mdi:thermometer

          # All four BTHome sensors, which only report while the garage ESP32
          # is up - it is HA's only Bluetooth proxy.
          - type: entities
            show_header_toggle: false
            entities:
              - type: section
                label: Temperature
              - entity: sensor.lounge_temp_temperature
                name: Lounge
              - entity: sensor.bedroom_temperature
                name: Bedroom
              - entity: sensor.aria_room_temperature
                name: Aria's room
              - entity: sensor.garage_temperature
                name: Garage
              - type: section
                label: Humidity
              - entity: sensor.lounge_temp_humidity
                name: Lounge
              - entity: sensor.bedroom_humidity
                name: Bedroom
              - entity: sensor.aria_room_humidity
                name: Aria's room
              - entity: sensor.garage_humidity
                name: Garage

          - type: custom:mini-graph-card
            name: Temperature (24h)
            hours_to_show: 24
            points_per_hour: 4
            line_width: 2
            entities:
              - entity: sensor.lounge_temp_temperature
                name: Lounge
              - entity: sensor.bedroom_temperature
                name: Bedroom
              - entity: sensor.aria_room_temperature
                name: Aria
              - entity: sensor.garage_temperature
                name: Garage
            show:
              fill: false
              labels: true

      # ---------------------------------------------------------------
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Needs attention
            heading_style: subtitle
            icon: mdi:alert-circle-outline

          # Anything unavailable across the devices that matter. Listed
          # explicitly rather than auto-generated so a stray unavailable
          # sensor elsewhere does not create noise.
          - type: entities
            show_header_toggle: false
            entities:
              - entity: binary_sensor.inverter_connection
                name: Inverter link
              - entity: sensor.msb_meter_power_total
                name: MSB meter (needs Tuya key)
              - entity: sensor.power_monitor_1_575ec1_power
                name: Network rack
              - entity: sensor.power_monitor_2_f27486_power
                name: Lounge media
              - entity: camera.doorbell_fluent
                name: Doorbell camera
              - entity: camera.back_yard_fluent
                name: Back yard camera
              - entity: camera.front_right_mainstream
                name: Front right camera
              - entity: camera.front_left_mainstream
                name: Front left
              - entity: camera.garage_right_mainstream
                name: Garage right
