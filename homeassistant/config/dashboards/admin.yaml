# Admin - infrastructure health. This is the "why did it break" screen.
#
# Built around what actually failed on 2026-07-28: the macOS TCP clock
# overflow that wedged every outbound connection, two cameras that hung while
# still drawing PoE, and devices that moved IP because they were on DHCP.

views:
  # =================================================================
  - title: Health
    path: health
    type: sections
    max_columns: 3
    icon: mdi:heart-pulse

    sections:
      # The reason this dashboard exists. macOS freezes its kernel TCP clock
      # at 49d17h uptime; everything outbound then fails while ping keeps
      # working. These are pushed from the host every 5 minutes.
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Mac mini host health
            heading_style: title
            icon: mdi:desktop-classic

          - type: custom:mushroom-template-card
            primary: >-
              {% set d = states('sensor.macmini_tcp_days_left') | int(99) %}
              {% if d > 14 %}TCP clock healthy
              {% elif d > 7 %}Reboot due soon
              {% elif d >= 0 %}REBOOT NEEDED
              {% else %}TCP CLOCK LIKELY FROZEN{% endif %}
            secondary: >-
              {{ states('sensor.macmini_tcp_days_left') }} days left -
              overflow {{ states('sensor.mac_mini_tcp_overflow_date') }}
              (up {{ states('sensor.macmini_uptime_days') }}d)
            icon: mdi:timer-alert-outline
            icon_color: >-
              {% set d = states('sensor.macmini_tcp_days_left') | int(99) %}
              {{ 'green' if d > 14 else 'orange' if d > 7 else 'red' }}
            tap_action:
              action: more-info
              entity: sensor.macmini_tcp_days_left

          - type: gauge
            entity: sensor.macmini_ephemeral_used
            name: Ephemeral ports used
            min: 0
            max: 100
            needle: true
            severity:
              green: 0
              yellow: 40
              red: 70

          - type: custom:mini-graph-card
            name: TIME_WAIT sockets (24h)
            entities:
              - sensor.macmini_time_wait
            hours_to_show: 24
            points_per_hour: 12
            line_width: 2
            show:
              fill: fade
              labels: true

      - type: grid
        cards:
          - type: heading
            heading: Core services
            heading_style: title
            icon: mdi:server
          - type: entities
            show_header_toggle: false
            entities:
              - entity: binary_sensor.inverter_connection
                name: Inverter link
              - entity: sensor.inverter_update_interval
                name: Inverter poll interval
              - entity: sun.sun
                name: Sun
              - entity: weather.forecast_home
                name: Weather

      - type: grid
        cards:
          - type: heading
            heading: Wifi signal
            heading_style: title
            icon: mdi:wifi
          # Weak signal is the usual precursor to a device dropping off and
          # re-addressing, which is what broke the solar integration.
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.power_monitor_1_575ec1_wifi_signal_percent
                name: Rack monitor
              - entity: sensor.power_monitor_2_f27486_wifi_signal_percent
                name: Lounge monitor
              - entity: sensor.power_monitor_3_f257d8_f257d8_wifi_signal_percent
                name: Washer monitor
              - entity: sensor.power_monitor_4_f27381_wifi_signal_percent
                name: Dryer monitor

      - type: grid
        cards:
          - type: heading
            heading: Garage door
            heading_style: title
            icon: mdi:garage
          # The ESP32 here is also HA's only Bluetooth proxy - if it goes
          # offline, every BTHome sensor goes with it. That is exactly what
          # happened when the Actron controller went down.
          - type: entities
            show_header_toggle: false
            entities:
              - entity: cover.garage_door_door
                name: Door
              - entity: binary_sensor.garage_door_position
                name: Position sensor
              - entity: sensor.garage_battery
                name: Sensor battery
              - entity: sensor.garage_voltage
                name: Sensor voltage
              - entity: sensor.garage_temperature
                name: Garage temperature
              - entity: sensor.garage_humidity
                name: Garage humidity
              - entity: sensor.garage_door_wifi_signal
                name: ESP32 wifi
              - entity: sensor.garage_door_uptime
                name: ESP32 uptime

      - type: grid
        cards:
          - type: heading
            heading: Device IP addresses
            heading_style: title
            icon: mdi:ip-network
          # All of these now hold DHCP reservations in the .226+ range. If one
          # shows an unexpected address, its reservation is not being honoured.
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.power_monitor_1_575ec1_ip_address
                name: Rack monitor
              - entity: sensor.power_monitor_2_f27486_ip_address
                name: Lounge monitor
              - entity: sensor.power_monitor_3_f257d8_f257d8_ip_address
                name: Washer monitor
              - entity: sensor.power_monitor_4_f27381_ip_address
                name: Dryer monitor

  # =================================================================
  - title: Cameras
    path: cameras
    type: sections
    max_columns: 2
    icon: mdi:cctv

    sections:
      - type: grid
        cards:
          - type: heading
            heading: Camera availability
            heading_style: title
            icon: mdi:cctv
          # A camera going unavailable here while its switch port still draws
          # PoE means the camera has hung - a PoE bounce on the port recovers
          # it. That is what recovered .241 and .244 on 2026-07-28.
          - type: entities
            show_header_toggle: false
            entities:
              - entity: camera.doorbell_fluent
                name: Doorbell (.240) ge-0/0/10
              - entity: camera.front_left_mainstream
                name: Front left (.241) ge-0/0/8
              - entity: camera.front_right_mainstream
                name: Front right (.242) ge-0/0/7
              - entity: camera.garage_right_mainstream
                name: Garage right (.244) ge-0/0/9
              - entity: camera.back_yard_fluent
                name: Reolink CX820 (.245) ge-0/0/4

      - type: grid
        cards:
          - type: heading
            heading: Known hardware faults
            heading_style: subtitle
            icon: mdi:alert
          - type: markdown
            content: >
              **Front Right (.243) - dead.**
              Switch port `ge-0/0/3`, link down since ~June 2026, drawing zero
              PoE. Moved 9.19 GB of video before failing. Needs physical
              attention: dead camera, damaged cable, or water ingress. Not
              recoverable by a PoE bounce - nothing is powered.


              **MSB Meter (.227) - authentication.**
              Reachable on port 6668, but every Tuya protocol version fails
              with error 904/914. The `local_key` rotated when the device
              re-provisioned. Fetch a new key from iot.tuya.com, then
              Settings → Devices → Tuya Local → MSB Meter → Configure. Until
              then its 16 sub-circuits are missing from the Energy dashboard.

  # =================================================================
  - title: Updates
    path: updates
    type: sections
    max_columns: 2
    icon: mdi:package-up

    sections:
      - type: grid
        cards:
          - type: heading
            heading: Pending updates
            heading_style: title
            icon: mdi:package-up
          - type: entities
            show_header_toggle: false
            entities:
              - entity: update.doorbell_firmware
                name: Doorbell firmware

      - type: grid
        cards:
          - type: heading
            heading: Automations
            heading_style: title
            icon: mdi:robot
          - type: entities
            show_header_toggle: false
            entities:
              - entity: automation.laundry_washer_started
                name: Washer started
              - entity: automation.laundry_washer_finished
                name: Washer finished
              - entity: automation.laundry_washer_back_to_idle
                name: Washer reset
              - entity: automation.laundry_dryer_started
                name: Dryer started
              - entity: automation.laundry_dryer_finished
                name: Dryer finished
              - entity: automation.laundry_dryer_back_to_idle
                name: Dryer reset

          # Lounge AV. All four are DISABLED by default (initial_state: false
          # in packages/lounge_av.yaml) and these toggles are how you turn them
          # on. Note that flipping one here does NOT survive a restart - the
          # package decides the state on every start.
          #
          # "Apple TV off" is the one that bites: apple_tv reports a lost
          # connection identically to a powered-off device, so if HA drops the
          # Apple TV this switches the TV and soundbar off mid-programme. It
          # did exactly that on 2026-08-29. Leave it off until the shutdown
          # path also checks the device is genuinely unreachable.
          - type: entities
            title: Lounge AV
            show_header_toggle: false
            entities:
              - entity: automation.lounge_apple_tv_wakes_the_frame
                name: Apple TV wakes the Frame
                secondary_info: last-triggered
              - entity: automation.lounge_apple_tv_off_kills_the_frame_and_soundbar
                name: Apple TV off kills the room
                secondary_info: last-triggered
              - entity: automation.lounge_nothing_playing_shut_the_room_down
                name: Idle timeout shuts the room down
                secondary_info: last-triggered
              - entity: automation.lounge_frame_turn_on_action
                name: Frame turn-on action (WoL)
                secondary_info: last-triggered

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Laundry thresholds
            heading_style: subtitle
            icon: mdi:tune
          # Derived from long-term statistics. The stop debounce is the one
          # value not measured against a real full-resolution cycle - if a
          # "finished" alert ever fires mid-soak, raise the washer value.
          - type: entities
            show_header_toggle: false
            entities:
              - entity: input_number.washer_start_threshold
                name: Washer start (W)
              - entity: input_number.washer_stop_threshold
                name: Washer stop (W)
              - entity: input_number.washer_stop_minutes
                name: Washer debounce (min)
              - entity: input_number.dryer_start_threshold
                name: Dryer start (W)
              - entity: input_number.dryer_stop_threshold
                name: Dryer stop (W)
              - entity: input_number.dryer_stop_minutes
                name: Dryer debounce (min)
              - type: section
                label: Current state
              - entity: input_select.washer_state
                name: Washer
              - entity: input_select.dryer_state
                name: Dryer

  # =================================================================
  # Vacuum - S7 battery health.
  #
  # Exists because the pack was diagnosed end-of-life on 2026-08-29 and
  # nothing in HA would have shown that: sensor.s7_battery reports a
  # modelled discharge curve, not real charge, and it carries no
  # state_class so its history vanished after 10 days. See
  # packages/vacuum.yaml for the full diagnosis and the two sensors
  # this view is built on.
  - title: Vacuum
    path: vacuum
    type: sections
    max_columns: 3
    icon: mdi:robot-vacuum

    sections:
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: S7 battery health
            heading_style: title
            icon: mdi:battery-heart-variant

          # The headline number. Minutes of actual cleaning achieved on one
          # charge - the only battery metric on this device that is measured
          # rather than modelled.
          - type: custom:mushroom-template-card
            primary: >-
              {% set m = states('sensor.s7_cleaning_minutes_per_charge')
                         | float(0) %}
              {% if not has_value('sensor.s7_cleaning_minutes_per_charge') %}
              Awaiting first clean
              {% elif m > 75 %}Battery healthy
              {% elif m >= 45 %}Battery wearing
              {% else %}BATTERY END OF LIFE{% endif %}
            secondary: >-
              {% if has_value('sensor.s7_cleaning_minutes_per_charge') %}
              {{ states('sensor.s7_cleaning_minutes_per_charge') }} min per
              charge - healthy is 90+, replace under 45
              {% else %}
              Populates when the vacuum next returns to dock
              {% endif %}
            icon: mdi:battery-heart-variant
            icon_color: >-
              {% set m = states('sensor.s7_cleaning_minutes_per_charge')
                         | float(0) %}
              {% if not has_value('sensor.s7_cleaning_minutes_per_charge') %}
              grey
              {% else %}
              {{ 'green' if m > 75 else 'orange' if m >= 45 else 'red' }}
              {% endif %}
            tap_action:
              action: more-info
              entity: sensor.s7_cleaning_minutes_per_charge

          # Long-term statistics, so this survives the 10-day purge and keeps
          # accumulating for the life of the machine. A step down here is the
          # pack aging; a step up is a successful battery swap.
          - type: statistics-graph
            title: Cleaning minutes per charge
            entities:
              - sensor.s7_cleaning_minutes_per_charge
            days_to_show: 365
            period: day
            stat_types:
              - mean
            chart_type: line

          # Read the dip, not the plateau. It sits docked at 100% nearly all
          # day; the interesting part is the cliff when it gives up mid-run.
          - type: custom:mini-graph-card
            name: Battery level (7d)
            entities:
              - sensor.s7_battery_level
            hours_to_show: 168
            points_per_hour: 2
            line_width: 2
            show:
              fill: fade
              labels: true

      - type: grid
        cards:
          - type: heading
            heading: Consumables
            heading_style: subtitle
            icon: mdi:wrench-clock

          # The integration reports these as seconds remaining, which is
          # unreadable on a wall display, and lets them go NEGATIVE once
          # overdue rather than clamping at zero. Both handled here.
          - type: custom:mushroom-template-card
            primary: Sensors
            secondary: >-
              {% set h = (states('sensor.s7_sensor_time_left')
                          | float(0) / 3600) | int %}
              {% if h < 0 %}OVERDUE by {{ h | abs }} h{% else %}{{ h }} h
              left{% endif %}
            icon: mdi:eye-outline
            icon_color: >-
              {% set h = (states('sensor.s7_sensor_time_left')
                          | float(0) / 3600) | int %}
              {{ 'red' if h < 0 else 'orange' if h < 10 else 'green' }}
            tap_action:
              action: more-info
              entity: sensor.s7_sensor_time_left

          - type: custom:mushroom-template-card
            primary: Filter
            secondary: >-
              {% set h = (states('sensor.s7_filter_time_left')
                          | float(0) / 3600) | int %}
              {% if h < 0 %}OVERDUE by {{ h | abs }} h{% else %}{{ h }} h
              left{% endif %}
            icon: mdi:air-filter
            icon_color: >-
              {% set h = (states('sensor.s7_filter_time_left')
                          | float(0) / 3600) | int %}
              {{ 'red' if h < 0 else 'orange' if h < 10 else 'green' }}
            tap_action:
              action: more-info
              entity: sensor.s7_filter_time_left

          - type: custom:mushroom-template-card
            primary: Side brush
            secondary: >-
              {% set h = (states('sensor.s7_side_brush_time_left')
                          | float(0) / 3600) | int %}
              {% if h < 0 %}OVERDUE by {{ h | abs }} h{% else %}{{ h }} h
              left{% endif %}
            icon: mdi:broom
            icon_color: >-
              {% set h = (states('sensor.s7_side_brush_time_left')
                          | float(0) / 3600) | int %}
              {{ 'red' if h < 0 else 'orange' if h < 20 else 'green' }}
            tap_action:
              action: more-info
              entity: sensor.s7_side_brush_time_left

          - type: custom:mushroom-template-card
            primary: Main brush
            secondary: >-
              {% set h = (states('sensor.s7_main_brush_time_left')
                          | float(0) / 3600) | int %}
              {% if h < 0 %}OVERDUE by {{ h | abs }} h{% else %}{{ h }} h
              left{% endif %}
            icon: mdi:brush
            icon_color: >-
              {% set h = (states('sensor.s7_main_brush_time_left')
                          | float(0) / 3600) | int %}
              {{ 'red' if h < 0 else 'orange' if h < 30 else 'green' }}
            tap_action:
              action: more-info
              entity: sensor.s7_main_brush_time_left

      - type: grid
        cards:
          - type: heading
            heading: Controls
            heading_style: subtitle
            icon: mdi:remote

          - type: tile
            entity: vacuum.s7
            features:
              - type: vacuum-commands
                commands:
                  - start_pause
                  - stop
                  - return_home
                  - locate

          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.s7_status
                name: Status
              - entity: sensor.s7_battery
                name: Battery (as reported - see packages/vacuum.yaml)
              - entity: binary_sensor.s7_charging
                name: Charging
              - type: section
                label: Settings
              - entity: select.s7_mop_intensity
                name: Mop intensity
              - entity: select.s7_selected_map
                name: Selected map
              - entity: number.s7_volume
                name: Volume
              - entity: switch.s7_do_not_disturb
                name: Do not disturb

      - type: grid
        cards:
          - type: heading
            heading: Lifetime
            heading_style: subtitle
            icon: mdi:counter

          # Context for the battery verdict above. 932 cleans and 1231 hours
          # is well past the point where a vacuum pack holds its rated
          # capacity, which is the whole story of this tab.
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.s7_total_cleaning_count
                name: Total cleans
              - entity: sensor.s7_total_cleaning_time
                name: Total runtime
              - entity: sensor.s7_total_cleaning_area
                name: Total area
              - entity: sensor.s7_last_clean_begin
                name: Last clean started
              - entity: sensor.s7_last_clean_end
                name: Last clean ended

          - type: picture-entity
            entity: image.s7_map_0
            show_state: false
            show_name: false
