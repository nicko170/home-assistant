# Cameras - five live cameras plus the Reolink doorbell.
#
# The camera at .243 is absent by design: dead hardware, no PoE draw, link down
# since ~June 2026. It needs physical repair, not configuration. It used to be
# labelled "Front Right", but that name now belongs to .242 - what .243 actually
# looked at is unconfirmed, so it is referred to by address only.
#
# Camera names were corrected on 2026-07-31 against their actual physical
# views. The old labels were inherited from whatever each camera self-reported
# and several were simply wrong:
#     .245 Reolink  "Front Left"     -> Back Yard
#     .242 Hik      "Garage"         -> Front Right
#     .241 Hik      "Hik Front Left" -> Front Left   (was already correct)
#     .244 Hik      "Hik 244"        -> Garage Right
#     .240 Reolink  "Doorbell"       -> unchanged
# Names now live in the HA device registry (name_by_user), so these labels and
# the entity ids follow from there rather than being overridden per card.

views:
  # =================================================================
  - title: Live
    path: live
    type: sections
    max_columns: 2
    icon: mdi:cctv

    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Front door
            heading_style: title
            icon: mdi:doorbell-video

          - type: picture-glance
            title: Doorbell
            camera_image: camera.doorbell_fluent
            camera_view: live
            entities:
              - entity: binary_sensor.doorbell_visitor
                name: Pressed
              - entity: binary_sensor.doorbell_person
                name: Person
              - entity: binary_sensor.doorbell_motion
                name: Motion
              - entity: switch.doorbell_record
                name: Recording

      - type: grid
        cards:
          - type: heading
            heading: Reolink
            heading_style: subtitle
            icon: mdi:video
          - type: picture-glance
            title: Back yard (Reolink CX820)
            camera_image: camera.back_yard_fluent
            camera_view: live
            entities:
              - entity: binary_sensor.back_yard_motion
                name: Motion
              - entity: binary_sensor.back_yard_person
                name: Person

      - type: grid
        cards:
          - type: heading
            heading: Hikvision
            heading_style: subtitle
            icon: mdi:video-outline
          - type: picture-glance
            title: Front right
            camera_image: camera.front_right_mainstream
            camera_view: live
            entities:
              - entity: binary_sensor.front_right_motion_alarm
                name: Motion
          - type: picture-glance
            title: Front left
            camera_image: camera.front_left_mainstream
            camera_view: live
            entities:
              - entity: binary_sensor.front_left_motion_alarm
                name: Motion
          - type: picture-glance
            title: Garage right
            camera_image: camera.garage_right_mainstream
            camera_view: live
            entities:
              - entity: binary_sensor.garage_right_motion_alarm
                name: Motion

  # =================================================================
  - title: Activity
    path: activity
    type: sections
    max_columns: 2
    icon: mdi:motion-sensor

    sections:
      - type: grid
        cards:
          - type: heading
            heading: Detection right now
            heading_style: title
            icon: mdi:motion-sensor
          - type: entities
            show_header_toggle: false
            entities:
              - type: section
                label: Doorbell
              - entity: binary_sensor.doorbell_visitor
                name: Doorbell pressed
              - entity: binary_sensor.doorbell_person
                name: Person
              - entity: binary_sensor.doorbell_motion
                name: Motion
              - type: section
                label: Front left (Reolink)
              - entity: binary_sensor.back_yard_person
                name: Person
              - entity: binary_sensor.back_yard_motion
                name: Motion
              - type: section
                label: Hikvision (ONVIF)
              - entity: binary_sensor.front_right_motion_alarm
                name: Front right motion
              - entity: binary_sensor.front_right_cell_motion_detection
                name: Front right cell motion
              - entity: binary_sensor.front_left_motion_alarm
                name: Front left motion
              - entity: binary_sensor.garage_right_motion_alarm
                name: Garage right motion

      - type: grid
        cards:
          - type: heading
            heading: Last 24 hours
            heading_style: title
            icon: mdi:history
          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: binary_sensor.doorbell_visitor
                name: Doorbell
              - entity: binary_sensor.doorbell_person
                name: Door person
              - entity: binary_sensor.back_yard_person
                name: Back yard person
              - entity: binary_sensor.front_right_motion_alarm
                name: Garage
              - entity: binary_sensor.front_left_motion_alarm
                name: Front left
              - entity: binary_sensor.garage_right_motion_alarm
                name: Garage right

  # =================================================================
  - title: Doorbell
    path: doorbell
    type: sections
    max_columns: 2
    icon: mdi:doorbell

    sections:
      - type: grid
        cards:
          - type: heading
            heading: Doorbell controls
            heading_style: title
            icon: mdi:tune
          - type: entities
            show_header_toggle: false
            entities:
              - entity: siren.doorbell_siren
                name: Siren
              - entity: switch.doorbell_siren_on_event
                name: Siren on event
              - entity: select.doorbell_doorbell_led
                name: LED mode
              - entity: number.doorbell_volume
                name: Volume
              - entity: select.doorbell_auto_quick_reply_message
                name: Auto quick reply
              - entity: number.doorbell_auto_quick_reply_time
                name: Quick reply delay
              - entity: switch.doorbell_record
                name: Record
              - entity: switch.doorbell_record_audio
                name: Record audio

      - type: grid
        cards:
          - type: heading
            heading: Detection tuning
            heading_style: title
            icon: mdi:target
          - type: entities
            show_header_toggle: false
            entities:
              - entity: number.doorbell_motion_sensitivity
                name: Motion sensitivity
              - entity: number.doorbell_ai_person_sensitivity
                name: Person sensitivity
              - entity: select.doorbell_day_night_mode
                name: Day/night mode
              - entity: sensor.doorbell_day_night_state
                name: Day/night state
              - entity: switch.doorbell_infrared_lights_in_night_mode
                name: IR at night
