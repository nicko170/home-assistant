# Power - the deep dive. Complements HA's built-in Energy dashboard rather
# than duplicating it; that one owns daily/monthly totals and cost.
#
# Feed-in tariff is 0, so export is waste, not income. Self-consumption is
# the headline metric here and exported energy is framed as a loss.
#
# Tariff from 2026-07-31: 98.80 c/day supply + 31.56 c/kWh flat, FIT 0. Chosen
# over a 117 c/day TOU plan (40.70 peak 15:00-20:59 / 21.89 off-peak). On the
# import measured at the time TOU was $57/yr cheaper, but that lead needs
# off-peak import above ~2 kWh/day, and both summer solar and moving the hot
# water into daylight push it below that. The flat rate is also indifferent to
# WHEN power is used, so a flat battery on a cloudy evening cannot land import
# at 40.70 c/kWh. Old plan was 166 c/day + 66 c/kWh, ~$1,507/yr, against
# ~$790/yr here.
#
# Tabs: Now / Today / Circuits / Laundry / Inverter. Circuits lives here rather than as
# its own sidebar dashboard - it is a breakdown of this same data, and Energy +
# Power + Circuits in the sidebar was three entries for one subject.

views:
  # =================================================================
  - title: Now
    path: now
    type: sections
    max_columns: 3
    icon: mdi:flash
    badges:
      - type: entity
        entity: sensor.inverter_battery
        name: Battery
      - type: entity
        entity: sensor.solar_pv_power
        name: Solar
      - type: entity
        entity: sensor.inverter_grid_power
        name: Grid
      - type: entity
        entity: sensor.inverter_load_power
        name: Load
      - type: entity
        entity: sensor.inverter_device_state
        name: Inverter

    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Live flow
            heading_style: title
            icon: mdi:transmission-tower

          - type: custom:power-flow-card-plus
            entities:
              battery:
                entity: sensor.inverter_battery_power
                state_of_charge: sensor.inverter_battery
                invert_state: true
              grid:
                entity: sensor.inverter_grid_power
                invert_state: true
              solar:
                entity: sensor.solar_pv_power
                display_zero_state: true
              home:
                entity: sensor.inverter_load_power
            clickable_entities: true
            display_zero_lines:
              mode: show
            use_new_flow_rate_model: true
            w_decimals: 0
            kw_decimals: 2
            watt_threshold: 1000

          - type: custom:apexcharts-card
            graph_span: 24h
            header:
              show: true
              title: Solar vs house load (24h)
              show_states: true
              colorize_states: true
            yaxis:
              - min: 0
            series:
              - entity: sensor.solar_pv_power
                name: Solar
                type: area
                curve: smooth
                stroke_width: 2
                opacity: 0.35
                group_by:
                  func: avg
                  duration: 10min
              - entity: sensor.inverter_load_power
                name: House
                type: line
                curve: smooth
                stroke_width: 2
                group_by:
                  func: avg
                  duration: 10min

      # -------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Battery
            heading_style: title
            icon: mdi:battery-high

          - type: gauge
            entity: sensor.inverter_battery
            name: State of charge
            min: 0
            max: 100
            needle: true
            severity:
              green: 50
              yellow: 20
              red: 0

          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.battery_remaining_energy
                name: Stored now
              - entity: sensor.battery_usable_capacity
                name: Usable capacity
              - entity: sensor.battery_total_capacity
                name: Total capacity
              - entity: sensor.inverter_battery_power
                name: Charge / discharge
              - entity: sensor.inverter_battery_soh
                name: State of health
              - entity: sensor.inverter_battery_cycles
                name: Cycles
              - entity: sensor.inverter_battery_temperature
                name: Temperature
              - entity: sensor.inverter_battery_voltage
                name: Voltage
              - entity: sensor.battery_time_to_empty
                name: Time to empty

  # =================================================================
  - title: Today
    path: today
    type: sections
    max_columns: 3
    icon: mdi:calendar-today

    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Today's energy
            heading_style: title
            icon: mdi:solar-power-variant

          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.inverter_today_production
                name: Solar generated
                icon: mdi:solar-power
              - entity: sensor.inverter_today_load_consumption
                name: House used
                icon: mdi:home-lightning-bolt
              - entity: sensor.inverter_today_energy_import
                name: Bought from grid
                icon: mdi:transmission-tower-import
              - type: section
                label: Given away - feed-in tariff is 0
              - entity: sensor.inverter_today_energy_export
                name: Exported for nothing
                icon: mdi:transmission-tower-export
              - type: section
                label: Battery
              - entity: sensor.inverter_today_battery_charge
                name: Charged
              - entity: sensor.inverter_today_battery_discharge
                name: Discharged

          - type: custom:apexcharts-card
            graph_span: 7d
            span:
              end: day
            header:
              show: true
              title: Daily solar vs import (7 days)
            all_series_config:
              type: column
              group_by:
                func: max
                duration: 1d
            series:
              - entity: sensor.inverter_today_production
                name: Solar
              - entity: sensor.inverter_today_energy_import
                name: Imported

      # -------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Self-consumption
            heading_style: title
            icon: mdi:home-percent

          # (production - export) / production. With FIT=0 this is the number
          # that matters: energy kept is worth the full import rate, energy
          # exported is worth nothing.
          - type: custom:mushroom-template-card
            primary: Self-consumption today
            secondary: >-
              {% set p = states('sensor.inverter_today_production') | float(0) %}
              {% set e = states('sensor.inverter_today_energy_export') | float(0) %}
              {% if p > 0 %}{{ (100 * (p - e) / p) | round(1) }}% kept on site
              {% else %}No generation yet today{% endif %}
            icon: mdi:home-percent
            icon_color: >-
              {% set p = states('sensor.inverter_today_production') | float(0) %}
              {% set e = states('sensor.inverter_today_energy_export') | float(0) %}
              {% if p <= 0 %}grey
              {% elif (p - e) / p > 0.8 %}green
              {% elif (p - e) / p > 0.5 %}orange
              {% else %}red{% endif %}

          - type: custom:mushroom-template-card
            primary: Value given away today
            secondary: >-
              {% set e = states('sensor.inverter_today_energy_export') | float(0) %}
              {{ e | round(2) }} kWh exported, about ${{ (e * 0.3156) | round(2) }}
              if it had offset import instead
            icon: mdi:cash-remove
            icon_color: red

      # -------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Monitored circuits
            heading_style: title
            icon: mdi:home-lightning-bolt-outline

          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.power_monitor_1_575ec1_power
                name: Network rack
              - entity: sensor.power_monitor_2_f27486_power
                name: Lounge media
              - entity: sensor.power_monitor_3_f257d8_f257d8_power
                name: Washing machine
              - entity: sensor.power_monitor_4_f27381_power
                name: Dryer

          - type: custom:mini-graph-card
            name: Monitored circuits (24h)
            hours_to_show: 24
            points_per_hour: 6
            line_width: 2
            entities:
              - entity: sensor.power_monitor_1_575ec1_power
                name: Rack
              - entity: sensor.power_monitor_2_f27486_power
                name: Lounge
              - entity: sensor.power_monitor_3_f257d8_f257d8_power
                name: Washer
              - entity: sensor.power_monitor_4_f27381_power
                name: Dryer
            show:
              fill: false
              labels: true

  # =================================================================
  # Circuits breakdown. Everything on this tab is built on the meter's 16
  # sub-circuit channels, which are verified against the inverter's load
  # register (see packages/msb.yaml). The meter's own main A/B/C channels are
  # deliberately NOT used here - phase A correlates with nothing and B/C are
  # zeroed by 1_phase mode.
  - title: Circuits
    path: circuits
    type: sections
    max_columns: 3
    icon: mdi:home-lightning-bolt
    badges:
      - type: entity
        entity: sensor.circuits_total_power
        name: House
      - type: entity
        entity: sensor.solar_pv_power
        name: Solar
      - type: entity
        entity: sensor.inverter_grid_power
        name: Grid
      - type: entity
        entity: sensor.inverter_battery
        name: Battery

    sections:
      # ---------------------------------------------------------------
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Where the power is going
            heading_style: title
            icon: mdi:transit-connection-variant

          - type: custom:sankey-chart
            show_names: true
            show_states: true
            show_icons: false
            unit_prefix: k
            round: 2
            min_box_height: 4
            min_box_distance: 3
            height: 420
            sections:
              # Sources feeding the house.
              - entities:
                  - entity_id: sensor.solar_pv_power
                    name: Solar
                    color: var(--warning-color)
                    children:
                      - sensor.circuits_total_power
                      - sensor.flow_battery_charge
                      - sensor.flow_grid_export
                  - entity_id: sensor.flow_grid_import
                    name: Grid import
                    color: var(--error-color)
                    children:
                      - sensor.circuits_total_power
                  - entity_id: sensor.flow_battery_discharge
                    name: Battery out
                    color: var(--success-color)
                    children:
                      - sensor.circuits_total_power
              # The house total, plus the two non-house sinks.
              - entities:
                  - entity_id: sensor.circuits_total_power
                    name: House
                    children:
                      - sensor.msb_meter_power_sub01
                      - sensor.msb_meter_power_sub02
                      - sensor.msb_meter_power_sub03
                      - sensor.msb_meter_power_sub04
                      - sensor.msb_meter_power_sub05
                      - sensor.msb_meter_power_sub06
                      - sensor.msb_meter_power_sub07
                      - sensor.msb_meter_power_sub08
                      - sensor.msb_meter_power_sub09
                      - sensor.msb_meter_power_sub10
                      - sensor.msb_meter_power_sub11
                      - sensor.msb_meter_power_sub12
                      - sensor.msb_meter_power_sub13
                      - sensor.msb_meter_power_sub14
                      - sensor.msb_meter_power_sub15
                      - sensor.msb_meter_power_sub16
                  - entity_id: sensor.flow_battery_charge
                    name: Battery in
                    color: var(--success-color)
                  - entity_id: sensor.flow_grid_export
                    name: Export
                    color: var(--error-color)
              # The 16 circuits themselves.
              - entities:
                  - entity_id: sensor.msb_meter_power_sub01
                    name: Light 1
                  - entity_id: sensor.msb_meter_power_sub02
                    name: Light 2
                  - entity_id: sensor.msb_meter_power_sub03
                    name: Light 3
                  - entity_id: sensor.msb_meter_power_sub04
                    name: Circuit 04
                  # The laundry circuit feeds the washer and dryer, each of
                  # which has its own plug monitor, so it breaks out further.
                  - entity_id: sensor.msb_meter_power_sub05
                    name: Laundry + lounge
                    children:
                      - sensor.power_monitor_3_f257d8_f257d8_power
                      - sensor.power_monitor_4_f27381_power
                      - sensor.power_monitor_2_f27486_power
                  - entity_id: sensor.msb_meter_power_sub06
                    name: Garage
                  - entity_id: sensor.msb_meter_power_sub07
                    name: Kitchen
                  - entity_id: sensor.msb_meter_power_sub08
                    name: Circuit 08
                  - entity_id: sensor.msb_meter_power_sub09
                    name: Circuit 09
                  - entity_id: sensor.msb_meter_power_sub10
                    name: Aircon
                  - entity_id: sensor.msb_meter_power_sub11
                    name: Circuit 11
                  - entity_id: sensor.msb_meter_power_sub12
                    name: Stove
                  - entity_id: sensor.msb_meter_power_sub13
                    name: Circuit 13
                  - entity_id: sensor.msb_meter_power_sub14
                    name: Circuit 14
                  - entity_id: sensor.msb_meter_power_sub15
                    name: Water pump
                  - entity_id: sensor.msb_meter_power_sub16
                    name: Hot water
              # Sub-metered appliances hanging off the laundry/lounge circuit.
              - entities:
                  - entity_id: sensor.power_monitor_3_f257d8_f257d8_power
                    name: Washing machine
                  - entity_id: sensor.power_monitor_4_f27381_power
                    name: Dryer
                  - entity_id: sensor.power_monitor_2_f27486_power
                    name: Lounge media

      # ---------------------------------------------------------------
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Circuit power (24h)
            heading_style: title
            icon: mdi:chart-areaspline

          - type: custom:apexcharts-card
            graph_span: 24h
            stacked: true
            header:
              show: true
              title: Stacked circuit draw
              show_states: false
            apex_config:
              chart:
                height: 340
              legend:
                show: true
                fontSize: 11px
              stroke:
                width: 0
              dataLabels:
                enabled: false
            all_series_config:
              type: area
              curve: smooth
              opacity: 0.75
              stroke_width: 0
              group_by:
                func: avg
                duration: 10min
            series:
              - entity: sensor.msb_meter_power_sub01
                name: Light 1
              - entity: sensor.msb_meter_power_sub02
                name: Light 2
              - entity: sensor.msb_meter_power_sub03
                name: Light 3
              - entity: sensor.msb_meter_power_sub04
                name: C04
              - entity: sensor.msb_meter_power_sub05
                name: Laundry + lounge
              - entity: sensor.msb_meter_power_sub06
                name: Garage
              - entity: sensor.msb_meter_power_sub07
                name: Kitchen
              - entity: sensor.msb_meter_power_sub08
                name: C08
              - entity: sensor.msb_meter_power_sub09
                name: C09
              - entity: sensor.msb_meter_power_sub10
                name: Aircon
              - entity: sensor.msb_meter_power_sub11
                name: C11
              - entity: sensor.msb_meter_power_sub12
                name: Stove
              - entity: sensor.msb_meter_power_sub13
                name: C13
              - entity: sensor.msb_meter_power_sub14
                name: C14
              - entity: sensor.msb_meter_power_sub15
                name: Water pump
              - entity: sensor.msb_meter_power_sub16
                name: Hot water

          - type: custom:apexcharts-card
            graph_span: 24h
            header:
              show: true
              title: Switchboard total vs inverter load
              show_states: true
              colorize_states: true
            apex_config:
              chart:
                height: 220
            series:
              - entity: sensor.circuits_total_power
                name: Sum of 16 circuits
                type: area
                curve: smooth
                opacity: 0.3
                stroke_width: 2
                group_by:
                  func: avg
                  duration: 5min
              - entity: sensor.inverter_load_power
                name: Inverter load register
                type: line
                curve: smooth
                stroke_width: 2
                group_by:
                  func: avg
                  duration: 5min

      # ---------------------------------------------------------------
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Energy today
            heading_style: title
            icon: mdi:counter

          - type: entities
            show_header_toggle: false
            state_color: false
            entities:
              - entity: sensor.light_1
                name: Light 1
              - entity: sensor.light_2
                name: Light 2
              - entity: sensor.light_3
                name: Light 3
              - entity: sensor.circuit_04
                name: Circuit 04
              - entity: sensor.laundry_and_lounge
                name: Laundry and lounge
              # template-entity-row purely to round these two. Their source is
              # an ESPHome counter with full float precision, unlike the meter's
              # own energy_subNN channels which are inherently 2 dp. YAML
              # utility_meter entities are not in the entity registry, so
              # display precision cannot be set on them the usual way.
              - type: custom:template-entity-row
                entity: sensor.washing_machine
                name: "  ↳ Washing machine"
                state: >-
                  {{ states('sensor.washing_machine') | float(0) | round(2) }} kWh
              - type: custom:template-entity-row
                entity: sensor.dryer
                name: "  ↳ Dryer"
                state: >-
                  {{ states('sensor.dryer') | float(0) | round(2) }} kWh
              - type: custom:template-entity-row
                entity: sensor.lounge_media
                name: "  ↳ Lounge media"
                state: >-
                  {{ states('sensor.lounge_media') | float(0) | round(2) }} kWh
              - entity: sensor.garage
                name: Garage
              - type: custom:template-entity-row
                entity: sensor.network_rack
                name: "  ↳ Network rack"
                state: >-
                  {{ states('sensor.network_rack') | float(0) | round(2) }} kWh
              - entity: sensor.kitchen
                name: Kitchen
              - entity: sensor.circuit_08
                name: Circuit 08
              - entity: sensor.circuit_09
                name: Circuit 09
              - entity: sensor.aircon
                name: Aircon
              - entity: sensor.circuit_11
                name: Circuit 11
              - entity: sensor.stove
                name: Stove
              - entity: sensor.circuit_13
                name: Circuit 13
              - entity: sensor.circuit_14
                name: Circuit 14
              - entity: sensor.water_pump
                name: Water pump
              - entity: sensor.hot_water
                name: Hot water

      # ---------------------------------------------------------------
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Meter health
            heading_style: subtitle
            icon: mdi:gauge
          - type: markdown
            content: >-
              The 16 sub-circuits are verified against the inverter's load
              register and are safe to build on. The meter's own **main channels
              are not** - phase A tracks nothing recognisable, and B/C are zeroed
              because `meter_type` is `1_phase`. Switching the meter to 3-phase
              mode should wake up the solar and battery CTs on B and C.
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.msb_meter_meter_type
                name: Meter mode
              - entity: sensor.msb_meter_voltage_a
                name: Mains voltage
              - entity: sensor.msb_meter_energy_consumed
                name: Meter lifetime consumed
              - entity: sensor.circuits_total_power
                name: Sum of circuits
              - entity: sensor.inverter_load_power
                name: Inverter load (cross-check)
  # =================================================================
  # Laundry. The cycle tables are built from the accumulating history
  # sensors in packages/laundry.yaml, which only hold cycles completed
  # since they were deployed - the logbook below covers anything older,
  # straight from the recorder.
  - title: Laundry
    path: laundry
    type: sections
    max_columns: 2
    icon: mdi:washing-machine
    badges:
      - type: entity
        entity: input_select.washer_state
        name: Washer
      - type: entity
        entity: input_select.dryer_state
        name: Dryer
      - type: entity
        entity: sensor.laundry_and_lounge
        name: Circuit today

    sections:
      - type: grid
        cards:
          - type: heading
            heading: Washer cycles
            heading_style: title
            icon: mdi:washing-machine
          - type: markdown
            content: >-
              {% set cycles = state_attr('sensor.washer_cycle_history','cycles') %}
              {% if cycles %}
              | Started | Finished | Run | Energy |
              |---|---|---:|---:|
              {% for c in cycles | reverse %}| {{ as_timestamp(c.start) | timestamp_custom('%a %d %b %H:%M', true) }} | {{ as_timestamp(c.end) | timestamp_custom('%H:%M', true) }} | {{ c.mins | int }} min | {{ '%.2f' | format(c.kwh | float(0)) }} kWh |
              {% endfor %}

              **{{ cycles | length }} cycles**, total {{ '%.1f' | format(cycles | map(attribute='kwh') | map('float',0) | sum) }} kWh,
              average {{ (cycles | map(attribute='mins') | map('int') | sum / (cycles | length)) | round(0) }} min
              {% else %}
              No completed washer cycles recorded yet. This table fills as cycles
              finish; see the logbook below for history from before it existed.
              {% endif %}

      - type: grid
        cards:
          - type: heading
            heading: Dryer cycles
            heading_style: title
            icon: mdi:tumble-dryer
          - type: markdown
            content: >-
              {% set cycles = state_attr('sensor.dryer_cycle_history','cycles') %}
              {% if cycles %}
              | Started | Finished | Run | Energy |
              |---|---|---:|---:|
              {% for c in cycles | reverse %}| {{ as_timestamp(c.start) | timestamp_custom('%a %d %b %H:%M', true) }} | {{ as_timestamp(c.end) | timestamp_custom('%H:%M', true) }} | {{ c.mins | int }} min | {{ '%.2f' | format(c.kwh | float(0)) }} kWh |
              {% endfor %}

              **{{ cycles | length }} cycles**, total {{ '%.1f' | format(cycles | map(attribute='kwh') | map('float',0) | sum) }} kWh,
              average {{ (cycles | map(attribute='mins') | map('int') | sum / (cycles | length)) | round(0) }} min
              {% else %}
              No completed dryer cycles recorded yet.
              {% endif %}

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Power traces
            heading_style: title
            icon: mdi:chart-line
          - type: custom:apexcharts-card
            graph_span: 3d
            header:
              show: true
              title: Washer and dryer draw (3 days)
              show_states: true
              colorize_states: true
            yaxis:
              - min: 0
            series:
              - entity: sensor.power_monitor_3_f257d8_f257d8_power
                name: Washer
                type: area
                curve: stepline
                opacity: 0.4
                stroke_width: 1
                group_by:
                  func: max
                  duration: 5min
              - entity: sensor.power_monitor_4_f27381_power
                name: Dryer
                type: area
                curve: stepline
                opacity: 0.4
                stroke_width: 1
                group_by:
                  func: max
                  duration: 5min

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Full history from the recorder
            heading_style: subtitle
            icon: mdi:history
          - type: logbook
            target:
              entity_id:
                - input_select.washer_state
                - input_select.dryer_state
            hours_to_show: 168

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Detection thresholds
            heading_style: subtitle
            icon: mdi:tune
          - type: entities
            show_header_toggle: false
            entities:
              - entity: input_number.washer_start_threshold
              - entity: input_number.washer_stop_threshold
              - entity: input_number.washer_stop_minutes
              - type: divider
              - entity: input_number.dryer_start_threshold
              - entity: input_number.dryer_stop_threshold
              - entity: input_number.dryer_stop_minutes

  - title: Inverter
    path: inverter
    type: sections
    max_columns: 3
    icon: mdi:cog-outline

    sections:
      - type: grid
        cards:
          - type: heading
            heading: Health
            heading_style: title
            icon: mdi:heart-pulse
          - type: entities
            show_header_toggle: false
            entities:
              - entity: binary_sensor.inverter_connection
                name: Link
              - entity: sensor.inverter_device_state
                name: State
              - entity: sensor.inverter_device_fault
                name: Fault
              - entity: sensor.inverter_temperature
                name: Temperature
              - entity: sensor.inverter_radiator_temperature
                name: Radiator
              - entity: sensor.inverter_module_temperature
                name: Module
              - entity: sensor.inverter_insulation_resistance
                name: Insulation

      - type: grid
        cards:
          - type: heading
            heading: AC side
            heading_style: title
            icon: mdi:sine-wave
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.inverter_l1_voltage
                name: L1 voltage
              - entity: sensor.inverter_l1_current
                name: L1 current
              - entity: sensor.inverter_frequency
                name: Frequency
              - entity: sensor.inverter_load_ups_power
                name: UPS output

      - type: grid
        cards:
          - type: heading
            heading: Solar
            heading_style: title
            icon: mdi:solar-panel
          - type: markdown
            content: >-
              The inverter does not report its PV registers - PV1/PV2 read ~1.7 V
              and 0 W even in full sun. **Solar PV power** below is derived from
              the energy balance (load + grid + battery), which is accurate to
              within 1% of the production counter. Per-string breakdown is not
              available from this inverter.
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.solar_pv_power
                name: Solar PV power (derived)
              - entity: sensor.inverter_today_production
                name: Produced today
              - entity: sensor.inverter_total_production
                name: Produced all time
              - entity: sensor.inverter_device_state
                name: Inverter state
              - entity: sensor.inverter_device_fault
                name: Inverter fault

      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Controls - change these deliberately
            heading_style: subtitle
            icon: mdi:tune
          # Export Priority must never be selected while the feed-in tariff is
          # 0. Export Surplus Limitation = Enabled with a 0 W limit forces all
          # generation into the battery and house loads.
          - type: entities
            show_header_toggle: false
            entities:
              - entity: select.inverter_storage_control_mode
                name: Storage control mode
              - entity: select.inverter_export_surplus_limitation
                name: Export limitation
              - entity: number.inverter_export_surplus_power
                name: Export limit (W)
              - entity: sensor.inverter_total_production
                name: Lifetime production
              - entity: sensor.inverter_total_energy_export
                name: Lifetime export
