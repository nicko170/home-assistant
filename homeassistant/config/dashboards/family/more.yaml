# More - everything that is not calendar, chores or dinner.
#
# Split by consequence, not by category. Aria may freely touch the top half:
# lights and music cannot hurt anyone and a wrong tap is instantly undone. The
# bottom half opens the garage and shows camera feeds, so it sits behind a PIN.
#
# The gate uses CONDITIONAL cards, so while locked the garage button is absent
# from the DOM entirely - not hidden with CSS, which would leave a working
# control one inspector-click away. It is a child-proof latch, not security.
title: More
path: more
icon: mdi:dots-horizontal
type: panel
cards:
  - type: vertical-stack
    cards:
      # ---------------- open to everyone ----------------
      - type: heading
        heading: Anyone can use these
        heading_style: title
        icon: mdi:hand-wave

      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:button-card
            entity: light.back_yard_floodlight
            name: Back yard light
            icon: mdi:lightbulb
            tap_action: {action: toggle}
            styles: &tile
              card:
                - height: 130px
                - border-radius: 22px
                - box-shadow: none
                - background: "#FFFFFF"
                - border: 3px solid var(--divider-color)
              icon:
                - width: 56px
                - color: var(--secondary-text-color)
              name:
                - font-size: 1rem
                - font-weight: 700
            state: &tilestate
              - value: "on"
                styles:
                  card:
                    - background: "#FFF8E6"
                    - border: 3px solid var(--family-shared)
                  icon:
                    - color: var(--family-shared)

          - type: custom:button-card
            entity: media_player.lounge_room
            name: Lounge music
            icon: mdi:speaker
            tap_action: {action: more-info}
            styles: *tile
            state: *tilestate

          - type: custom:button-card
            entity: media_player.play_room
            name: Play room
            icon: mdi:speaker-wireless
            tap_action: {action: more-info}
            styles: *tile
            state: *tilestate

      # ---------------- the latch ----------------
      - type: conditional
        conditions:
          - condition: state
            entity: input_boolean.family_unlocked
            state: "off"
        card:
          type: vertical-stack
          cards:
            - type: heading
              heading: Grown-ups only
              heading_style: title
              icon: mdi:lock

            - type: markdown
              content: >-
                {% set n = states('input_text.family_pin_entry') | length %}
                ### {{ '●' * n }}{{ '○' * (4 - n) }}
                Enter the PIN to show cameras, the map and the garage.
              card_mod:
                style: |
                  ha-card { box-shadow: none; border: none; background: transparent; }
                  h3 { font-size: 2.4rem; letter-spacing: 0.35em; margin: 4px 0; }

            - type: grid
              columns: 3
              square: false
              cards:
                - &k1
                  type: custom:button-card
                  name: "1"
                  tap_action:
                    action: call-service
                    service: script.family_pin_digit
                    service_data: {digit: "1"}
                  styles: &key
                    card:
                      - height: 84px
                      - border-radius: 18px
                      - box-shadow: none
                      - background: "#FFFFFF"
                      - border: 3px solid var(--divider-color)
                    name:
                      - font-size: 1.7rem
                      - font-weight: 800
                - <<: *k1
                  name: "2"
                  tap_action: {action: call-service, service: script.family_pin_digit, service_data: {digit: "2"}}
                - <<: *k1
                  name: "3"
                  tap_action: {action: call-service, service: script.family_pin_digit, service_data: {digit: "3"}}
                - <<: *k1
                  name: "4"
                  tap_action: {action: call-service, service: script.family_pin_digit, service_data: {digit: "4"}}
                - <<: *k1
                  name: "5"
                  tap_action: {action: call-service, service: script.family_pin_digit, service_data: {digit: "5"}}
                - <<: *k1
                  name: "6"
                  tap_action: {action: call-service, service: script.family_pin_digit, service_data: {digit: "6"}}
                - <<: *k1
                  name: "7"
                  tap_action: {action: call-service, service: script.family_pin_digit, service_data: {digit: "7"}}
                - <<: *k1
                  name: "8"
                  tap_action: {action: call-service, service: script.family_pin_digit, service_data: {digit: "8"}}
                - <<: *k1
                  name: "9"
                  tap_action: {action: call-service, service: script.family_pin_digit, service_data: {digit: "9"}}
                - <<: *k1
                  name: Clear
                  tap_action: {action: call-service, service: script.family_pin_clear, service_data: {}}
                - <<: *k1
                  name: "0"
                  tap_action: {action: call-service, service: script.family_pin_digit, service_data: {digit: "0"}}

      # ---------------- unlocked ----------------
      - type: conditional
        conditions:
          - condition: state
            entity: input_boolean.family_unlocked
            state: "on"
        card:
          type: vertical-stack
          cards:
            - type: heading
              heading: Unlocked - relocks in 5 minutes
              heading_style: title
              icon: mdi:lock-open-variant

            - type: custom:button-card
              entity: cover.garage_door_door
              name: Garage door
              icon: mdi:garage
              show_state: true
              tap_action:
                action: call-service
                service: cover.toggle
                service_data: {entity_id: cover.garage_door_door}
              styles:
                card:
                  - height: 110px
                  - border-radius: 22px
                  - box-shadow: none
                  - background: var(--family-nick)
                grid:
                  - grid-template-areas: '"i n" "i s"'
                  - grid-template-columns: 92px auto
                  - justify-items: start
                  - padding: 0 20px
                icon: [width: 54px, color: "#FFFFFF"]
                name: [font-size: 1.05rem, font-weight: 800, color: "#FFFFFF"]
                state: [font-size: 1.5rem, font-weight: 800, color: rgba(255,255,255,0.9)]

            - type: map
              entities:
                - person.admin
                - person.elle_gallo
              theme_mode: light
              hours_to_show: 0

            - type: grid
              columns: 2
              square: false
              cards:
                - type: picture-entity
                  entity: camera.doorbell_fluent
                  camera_view: auto
                  show_state: false
                  show_name: true
                - type: picture-entity
                  entity: camera.front_left_mainstream
                  camera_view: auto
                  show_state: false
                  show_name: true
                - type: picture-entity
                  entity: camera.back_yard_fluent
                  camera_view: auto
                  show_state: false
                  show_name: true
                - type: picture-entity
                  entity: camera.garage_right_mainstream
                  camera_view: auto
                  show_state: false
                  show_name: true

            - type: custom:button-card
              name: Lock again now
              icon: mdi:lock
              tap_action:
                action: call-service
                service: script.family_lock_now
                service_data: {}
              styles:
                card:
                  - height: 64px
                  - border-radius: 18px
                  - box-shadow: none
                  - background: "#FFFFFF"
                  - border: 3px solid var(--divider-color)
                name: [font-size: 1.05rem, font-weight: 800]

      - !include _navbar.yaml
