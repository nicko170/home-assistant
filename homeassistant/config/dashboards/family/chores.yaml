# Chores - Aria's board. She is 4 and cannot read.
#
# Design intent: the icon is the content, the word is a caption for adults.
# Every tile is a 150px target because a 4-year-old aims with a whole hand, and
# the three states have to be distinguishable at a glance from across a kitchen
# WITHOUT reading them:
#
#   pending    full colour, raised          "do this"
#   claimed    faded with a dashed outline  "I did it, waiting for a grown-up"
#   completed  green, flat, ticked          "done"
#
# Tapping a tile presses that chore's ChoreOps claim button. Claim needs
# ChoreOps' own kiosk_mode enabled, because Aria has no Home Assistant account
# by design - see the spec's non-goals.
title: Chores
path: chores
icon: mdi:star-circle
type: panel
cards:
  - type: vertical-stack
    cards:
      # Star tally. The number is the reward, so it is the biggest thing here.
      - type: custom:button-card
        entity: sensor.aria_choreops_stars
        name: Aria's stars
        icon: mdi:star
        show_state: true
        show_name: true
        show_icon: true
        tap_action:
          action: none
        styles:
          card:
            - height: "clamp(92px, 17vw, 120px)"
            - border-radius: 22px
            - background: "var(--family-aria, #FF6B9D)"
            - box-shadow: none
          grid:
            - grid-template-areas: '"i s" "i n"'
            - grid-template-columns: clamp(72px, 14vw, 120px) auto
            - justify-items: start
            - padding: 0 22px
          icon:
            - width: "clamp(46px, 9vw, 72px)"
            - color: "var(--family-on-strong, #FFFFFF)"
          state:
            - font-size: "clamp(1.9rem, 6.6vw, 3.2rem)"
            - font-weight: 800
            - color: "var(--family-on-strong, #FFFFFF)"
            - line-height: 1
          name:
            - font-size: "clamp(0.85rem, 2.2vw, 0.95rem)"
            - font-weight: 700
            - letter-spacing: 0.12em
            - text-transform: uppercase
            - color: rgba(255,255,255,0.85)

      # Progress to the next reward. A 4-year-old cannot read "7/10" but can
      # see a bar that is nearly full.
      - type: custom:bar-card
        entities:
          - entity: sensor.aria_choreops_stars
            name: Ice cream at 10 stars
        max: 10
        min: 0
        height: 44px
        positions:
          icon: 'off'
          indicator: 'off'
          minmax: 'off'
          value: inside
          name: inside
        color: "var(--family-shared, #F7B731)"
        card_mod:
          style: |
            ha-card { box-shadow: none; border: none; border-radius: 18px; }

      # The board. Three columns so tiles stay large on a 10" screen.
      - type: grid
        columns: 3
        square: false
        card_mod:
          style: |
            #root {
              grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)) !important;
              gap: clamp(8px, 1.6vw, 16px) !important;
            }
        cards:
          - type: custom:button-card
            entity: sensor.aria_choreops_chore_status_get_dressed
            name: Get dressed
            icon: mdi:tshirt-crew
            show_state: false
            tap_action:
              action: call-service
              service: button.press
              service_data:
                entity_id: button.aria_choreops_claim_chore_get_dressed
            styles: &tile
              card:
                - height: "clamp(104px, 20vw, 150px)"
                - border-radius: 22px
                - box-shadow: none
                - background: "var(--family-tile, var(--card-background-color))"
                - border: 3px solid var(--divider-color)
              icon:
                - width: "clamp(44px, 8.6vw, 68px)"
                - color: "var(--family-aria, #FF6B9D)"
              name:
                - font-size: "clamp(0.92rem, 2.5vw, 1.05rem)"
                - font-weight: 700
                - color: var(--primary-text-color)
            state: &tilestate
              - value: claimed
                styles:
                  card:
                    - background: "var(--family-tile-claimed, var(--card-background-color))"
                    - border: 3px dashed "var(--family-aria, #FF6B9D)"
                    - opacity: "0.75"
                  icon:
                    - color: "var(--family-aria, #FF6B9D)"
              - value: completed
                styles:
                  card:
                    - background: "var(--family-tile-done, var(--card-background-color))"
                    - border: 3px solid "var(--family-eden, #26C6A0)"
                  icon:
                    - color: "var(--family-eden, #26C6A0)"
                  name:
                    - color: "var(--family-done-ink, #1B7A5A)"
              - value: overdue
                styles:
                  card:
                    - border: 3px solid "#F7B731"

          - type: custom:button-card
            entity: sensor.aria_choreops_chore_status_brush_teeth
            name: Brush teeth
            icon: mdi:toothbrush
            show_state: false
            tap_action:
              action: call-service
              service: button.press
              service_data:
                entity_id: button.aria_choreops_claim_chore_brush_teeth
            styles: *tile
            state: *tilestate

          - type: custom:button-card
            entity: sensor.aria_choreops_chore_status_tidy_toys
            name: Tidy toys
            icon: mdi:teddy-bear
            show_state: false
            tap_action:
              action: call-service
              service: button.press
              service_data:
                entity_id: button.aria_choreops_claim_chore_tidy_toys
            styles: *tile
            state: *tilestate

          - type: custom:button-card
            entity: sensor.aria_choreops_chore_status_shoes_away
            name: Shoes away
            icon: mdi:shoe-sneaker
            show_state: false
            tap_action:
              action: call-service
              service: button.press
              service_data:
                entity_id: button.aria_choreops_claim_chore_shoes_away
            styles: *tile
            state: *tilestate

          - type: custom:button-card
            entity: sensor.aria_choreops_chore_status_set_the_table
            name: Set the table
            icon: mdi:silverware-fork-knife
            show_state: false
            tap_action:
              action: call-service
              service: button.press
              service_data:
                entity_id: button.aria_choreops_claim_chore_set_the_table
            styles: *tile
            state: *tilestate

          - type: custom:button-card
            entity: sensor.aria_choreops_chore_status_teeth_at_night
            name: Teeth at night
            icon: mdi:weather-night
            show_state: false
            tap_action:
              action: call-service
              service: button.press
              service_data:
                entity_id: button.aria_choreops_claim_chore_teeth_at_night
            styles: *tile
            state: *tilestate

      - !include _navbar.yaml
