# Calendar - the week at a glance.
#
# Design intent: colour IS the identity. Every event carries a person prefix in
# Outlook ("Aria: Swimming") because that is how the six filtered calendar
# entities are derived - but the prefix is plumbing, not content. filterText
# strips it from the display, so the board shows "Swimming" in Aria-pink.
# Aria is 4 and cannot read; she finds her day by colour, not by words.
#
# legendToggle makes the legend the kid-facing control: tap pink, see only your
# own events. It is the one interaction a 4-year-old can discover unaided.
#
# type: panel gives full-bleed width, which a wall display wants and `sections`
# will not do - but a panel view renders EXACTLY ONE card, so everything below
# lives inside the single vertical-stack, the pop-up included.
title: Calendar
path: calendar
icon: mdi:calendar-month
type: panel
cards:
  - type: vertical-stack
    cards:
      # Opener. Deliberately the only button on this view: the week grid is the
      # content, and one unambiguous action beats a toolbar.
      - type: custom:button-card
        name: Add event
        icon: mdi:calendar-plus
        tap_action:
          action: navigate
          navigation_path: "#add-event"
        styles:
          card:
            - height: "clamp(54px, 10vw, 62px)"
            - border-radius: 18px
            - background: "var(--family-shared, #F7B731)"
            - box-shadow: none
          name:
            - font-size: "clamp(0.98rem, 2.7vw, 1.15rem)"
            - font-weight: 800
            - letter-spacing: 0.02em
            - color: "var(--family-on-warm, #1B2430)"
          icon:
            - width: "clamp(24px, 4.4vw, 30px)"
            - color: "var(--family-on-warm, #1B2430)"
          grid:
            - grid-template-areas: '"i n"'
            - grid-template-columns: clamp(34px, 7vw, 44px) auto
            - justify-items: start
            - padding: 0 18px

      - type: custom:week-planner-card
        days: 7
        startingDay: today
        locale: en-AU
        timeFormat: h:mma
        showLegend: true
        legendToggle: true
        hidePastEvents: false
        hideDaysWithoutEvents: false
        eventBackground: transparent
        # Columns by CARD WIDTH, not device. iPhone lands in extraSmall and
        # gets one full-width day; iPad landscape (~1180) lands in medium and
        # gets four, which reads far better than seven slivers; the wall tablet
        # in landscape gets the full week.
        columns:
          extraSmall: 1
          small: 3
          medium: 4
          large: 7
          extraLarge: 7
        weather:
          entity: weather.forecast_home
          showCondition: true
          showTemperature: true
          showLowTemperature: true
        calendars:
          - entity: calendar.family_shared
            name: Everyone
            color: "#F7B731"
            icon: mdi:home-heart
          - entity: calendar.family_nick
            name: Nick
            color: "#2E86DE"
            icon: mdi:account
            filterText: "^Nick:\\s*"
          - entity: calendar.family_elle
            name: Elle
            color: "#A55EEA"
            icon: mdi:account
            filterText: "^Elle:\\s*"
          - entity: calendar.family_aria
            name: Aria
            color: "#FF6B9D"
            icon: mdi:teddy-bear
            filterText: "^Aria:\\s*"
          - entity: calendar.family_eden
            name: Eden
            color: "#26C6A0"
            icon: mdi:baby-face-outline
            filterText: "^Eden:\\s*"
        card_mod:
          # The card is built to be themed through these custom properties, and
          # sizes each day with
          #   width: calc((100% - (cols - 1) * spacing) / cols)
          # so --days-columns must be left alone - the `columns:` config above
          # drives it. Setting it here would break the responsive behaviour.
          #
          # It also renders .date .number and .date .text natively, which is why
          # there is no dayFormat here any more: injecting HTML through
          # dayFormat put block elements inside the positioned .date and the
          # days overlapped on wide screens.
          style: |
            ha-card {
              background: transparent;
              box-shadow: none;
              border: none;
              padding: 0 4px;

              --days-spacing: clamp(8px, 1.4vw, 18px);
              --day-date-number-font-size: clamp(1.5rem, 4vw, 2.6rem);
              --day-date-number-line-height: 1.05em;
              --day-date-text-font-size: clamp(0.6rem, 1.4vw, 0.76rem);

              --events-margin-top: clamp(6px, 1vw, 12px);
              --event-spacing: 6px;
              --event-padding: clamp(6px, 1vw, 11px);
              --event-border-radius: 12px;
              --event-border-width: 6px;
              --event-font-size: clamp(0.86rem, 1.8vw, 1.02rem);
              --event-line-height: 1.3em;
              --event-icon-size: clamp(14px, 2vw, 18px);

              --legend-spacing: clamp(10px, 1.6vw, 16px);
              --legend-dot-size: 14px;
              --weather-icon-size: clamp(20px, 2.6vw, 30px);
              --weather-temperature-font-size: clamp(0.68rem, 1.4vw, 0.85rem);
            }
            /* The numeral carries the size; the weekday is a quiet label. */
            .container .day .date .number { font-weight: 800; }
            .container .day .date .text {
              text-transform: uppercase;
              letter-spacing: 0.12em;
              font-weight: 700;
              opacity: 0.6;
            }
            /* Legend is Aria's filter control - make it a real target. */
            .container .legend { font-weight: 700; }

      # Composer. Bubble Card v3.2.0+ standalone format: content lives in this
      # card's own cards: list. "Standalone" means it no longer NEEDS a
      # vertical-stack wrapper - it can still sit in one, which a panel view
      # requires.
      - type: custom:bubble-card
        card_type: pop-up
        name: New event
        icon: mdi:calendar-plus
        hash: "#add-event"
        cards:
          - type: entities
            entities:
              - entity: input_select.family_event_person
                name: Who is it for
              - entity: input_text.family_event_title
                name: What is it
              - entity: input_datetime.family_event_start
                name: When
              - entity: input_select.family_event_length
                name: How long
            card_mod:
              style: |
                ha-card { box-shadow: none; border: none; }
                .card-content { font-size: "clamp(0.95rem, 2.6vw, 1.1rem)"; font-weight: 600; }
          - type: custom:button-card
            name: Save to calendar
            icon: mdi:check-bold
            tap_action:
              action: call-service
              service: script.family_add_event
            styles:
              card:
                - height: "clamp(56px, 11vw, 68px)"
                - border-radius: 18px
                - background: "var(--family-aria, #FF6B9D)"
                - box-shadow: none
              name:
                - font-size: "clamp(1rem, 2.8vw, 1.2rem)"
                - font-weight: 800
                - color: "var(--family-on-strong, #FFFFFF)"
              icon:
                - width: "clamp(24px, 4.4vw, 30px)"
                - color: "var(--family-on-strong, #FFFFFF)"

      - !include _navbar.yaml
