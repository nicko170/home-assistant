
# Loads default set of integrations. Do not remove.
default_config:

# Packages: each file in packages/ is a self-contained feature bundle
# (helpers + templates + automations) rather than being scattered across
# configuration.yaml and automations.yaml.
homeassistant:
  packages: !include_dir_named packages

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - 172.24.0.1
    - 157.20.113.249
    - 100.100.189.37
    - 192.168.15.3

# Four purpose-built YAML dashboards. The default dashboard stays in storage
# mode so the existing HACS resource registrations continue to load for all
# dashboards; only these extra ones are YAML-managed.
lovelace:
  dashboards:
    home-overview:
      mode: yaml
      filename: dashboards/overview.yaml
      title: Overview
      icon: mdi:home-heart
      show_in_sidebar: true
      require_admin: false
    home-energy:
      mode: yaml
      filename: dashboards/energy.yaml
      title: Power
      icon: mdi:transmission-tower
      show_in_sidebar: true
      require_admin: false
    home-cameras:
      mode: yaml
      filename: dashboards/cameras.yaml
      title: Cameras
      icon: mdi:cctv
      show_in_sidebar: true
      require_admin: false
    home-admin:
      mode: yaml
      filename: dashboards/admin.yaml
      title: Admin
      icon: mdi:server
      show_in_sidebar: true
      require_admin: true
