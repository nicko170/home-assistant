
# Loads default set of integrations. Do not remove.
default_config:

# Packages: each file in packages/ is a self-contained feature bundle
# (helpers + templates + automations) rather than being scattered across
# configuration.yaml and automations.yaml.
homeassistant:
  packages: !include_dir_named packages

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - 172.24.0.1
    # Kept in secrets.yaml, not because they are credentials, but because
    # publishing this list tells an attacker exactly which source addresses HA
    # will trust for X-Forwarded-For - and one of them is unrelated production
    # infrastructure. The RFC1918 entries below are harmless to disclose.
    - !secret proxy_tunnel_host
    - !secret proxy_tailscale_host
    - 192.168.15.3

# Dashboards are fully YAML-managed.
#
# mode: yaml makes the DEFAULT dashboard (ui-lovelace.yaml) the Overview, so
# there is no duplicate "Overview" in the sidebar. The catch: YAML mode stops
# HA reading .storage/lovelace_resources, so every HACS card must be declared
# here or it silently fails to render on EVERY dashboard.
#
# hacstag cache-busting params are deliberately omitted - they change on every
# HACS card update and would go stale here. Hard-refresh the browser after
# updating a card.
lovelace:
  mode: yaml
  resources:
    - url: /hacsfiles/power-flow-card-plus/power-flow-card-plus.js
      type: module
    - url: /hacsfiles/lovelace-mushroom/mushroom.js
      type: module
    - url: /hacsfiles/mini-graph-card/mini-graph-card-bundle.js
      type: module
    - url: /hacsfiles/apexcharts-card/apexcharts-card.js
      type: module
    - url: /hacsfiles/lovelace-card-mod/card-mod.js
      type: module
    - url: /hacsfiles/advanced-camera-card/advanced-camera-card.js
      type: module
    - url: /hacsfiles/lovelace-template-entity-row/template-entity-row.js
      type: module
    - url: /hacsfiles/stack-in-card/stack-in-card.js
      type: module
    - url: /hacsfiles/lovelace-layout-card/layout-card.js
      type: module
    - url: /hacsfiles/bar-card/bar-card.js
      type: module
    - url: /hacsfiles/PlexMeetsHomeAssistant/plex-meets-homeassistant.js
      type: module
    # NOTE: the file is ha-sankey-chart.js, not sankey-chart.js. Because
    # lovelace is in yaml mode, HACS cannot register this itself.
    - url: /hacsfiles/ha-sankey-chart/ha-sankey-chart.js
      type: module
  dashboards:
    home-energy:
      mode: yaml
      filename: dashboards/energy.yaml
      title: Power
      icon: mdi:transmission-tower
      show_in_sidebar: true
      require_admin: false
    home-cameras:
      mode: yaml
      filename: dashboards/cameras.yaml
      title: Cameras
      icon: mdi:cctv
      show_in_sidebar: true
      require_admin: false
    home-family:
      mode: yaml
      filename: dashboards/family.yaml
      title: Family
      icon: mdi:account-group
      show_in_sidebar: true
      require_admin: false
    home-admin:
      mode: yaml
      filename: dashboards/admin.yaml
      title: Admin
      icon: mdi:server
      show_in_sidebar: true
      require_admin: true
