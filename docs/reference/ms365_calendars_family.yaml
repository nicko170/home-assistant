# REFERENCE COPY - not deployed, not read by Home Assistant.
#
# The live file is /config/ms365_storage/ms365_calendars_family.yaml on the mac
# mini. It is deliberately gitignored: the MS365 integration REWRITES it (it
# regenerates entries when calendars change), so tracking it would leave the
# deploy tree permanently dirty and every `git merge --ff-only` in deploy.sh
# would fail - the same class of breakage the .cache entry in .gitignore exists
# to prevent.
#
# This copy exists so the per-person filter design is recoverable and reviewable.
# If the live file is lost, recreate it from here and reload the integration.
#
# The filters implement the spec's per-person colouring: one shared Outlook
# calendar, subject prefixes ("Aria: Swimming"), and one HA calendar entity per
# person via `search`, plus a `shared` entity via `exclude` of all four prefixes.
# Verified 2026-08-23: each event routes to exactly one person entity.
