# Garage door - replaces the lost HomeSpan firmware.
#
# This device does two jobs:
#   1. pulses the door relay on GPIO 16 (momentary, like a button press)
#   2. acts as HA's Bluetooth proxy - it sits about a metre from the BTHome
#      door sensor, and was the only ESP32 available after the Actron went
#      offline. Restoring this also restores HA's only Bluetooth adapter.
#
# GPIO 16 was found empirically: the original sketch was lost, so a temporary
# discovery firmware exposed every safe candidate pin as a momentary switch
# and the relay was identified by ear.
#
# Position is read from the BTHome door sensor rather than inferred from
# commands, so it stays correct when the door is operated by its physical
# remote. Note this creates a deliberate boot-time circularity: the sensor
# only reports because this device is its proxy, so the cover reads closed
# for the first minute after a cold start.

substitutions:
  relay_pin: GPIO16

esphome:
  name: garage-door
  friendly_name: Garage Door

esp32:
  # HomeSpan reported board=esp32da (Arduino's name for the dual-antenna
  # WROOM-DA). PlatformIO does not know that name; the silicon is a plain
  # ESP32 so esp32dev is correct.
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO

api:
  encryption:
    key: !secret garage_api_key

ota:
  - platform: esphome
    password: !secret garage_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  manual_ip:
    static_ip: 192.168.15.17
    gateway: 192.168.15.1
    subnet: 255.255.255.0
    dns1: 192.168.15.1

# Kept so the device stays diagnosable from a browser without HA.
web_server:
  port: 80

# Restores HA's Bluetooth adapter, lost when the Actron ESP32 went offline.
# This is what brings binary_sensor.garage_door - and the other BTHome
# devices in range - back to life.
# PASSIVE scanning, deliberately.
#
# Active scanning transmits scan requests and waits for scan responses, which
# duty-cycles the radio - and the ESP32 shares one 2.4 GHz radio between WiFi
# and BLE. With active: true every BTHome sensor in the house was dropping out
# roughly every 35-45 minutes and returning 3-5 minutes later: garage 33
# dropouts in 24h, garage temp 33, lounge 32, aria 25, bedroom 20. Uniform
# across all of them, which is what proves it is the proxy and not any one
# sensor - the garage sensor sits 3 m away with a 100% battery at 3.02 V.
#
# BTHome is advertisement-only, so passive scanning is sufficient. Only set
# active back to true if something needs HA to CONNECT through the proxy
# (BLE locks, Switchbot and similar) - nothing here does.
#
# The near-100% duty cycle (300 of every 320 ms) is what catches infrequent
# advertisements reliably.
esp32_ble_tracker:
  scan_parameters:
    active: false
    interval: 320ms
    window: 300ms

bluetooth_proxy:
  active: false

# The physical relay. internal: true keeps it out of HA - the cover owns it,
# so nobody can leave the contact energised by toggling a stray switch.
switch:
  - platform: gpio
    pin: ${relay_pin}
    id: relay
    internal: true
    restore_mode: ALWAYS_OFF

# Door position, mirrored back from HA.
#
# Deliberately reads binary_sensor.garage_door_position, NOT the raw BTHome
# entity. The reed sensor reports ON when the magnet is present (door closed),
# which is the opposite of HA's door convention. The template sensor in
# packages/garage.yaml corrects that in one place.
binary_sensor:
  - platform: homeassistant
    id: door_is_open
    entity_id: binary_sensor.garage_door_position
    internal: true

cover:
  - platform: template
    name: Door
    id: garage_cover
    device_class: garage
    optimistic: false
    assumed_state: false
    lambda: |-
      if (id(door_is_open).state) {
        return COVER_OPEN;
      }
      return COVER_CLOSED;
    # A garage opener takes a single button press for open, close and stop -
    # the controller decides what that means based on its current state.
    open_action:
      - switch.turn_on: relay
      - delay: 400ms
      - switch.turn_off: relay
    close_action:
      - switch.turn_on: relay
      - delay: 400ms
      - switch.turn_off: relay
    stop_action:
      - switch.turn_on: relay
      - delay: 400ms
      - switch.turn_off: relay

sensor:
  - platform: wifi_signal
    name: WiFi signal
    update_interval: 120s
  - platform: uptime
    name: Uptime
