# pf rules letting the house LAN reach Home Assistant inside the OrbStack VM.
#
# THE PROBLEM
# HA runs at 192.168.139.2 on the OrbStack bridge. The Juniper routes
# 192.168.138.0/23 here and net.inet.ip.forwarding is on, but that is not
# enough on macOS, for two separate reasons:
#
#   1. pf does not pass forwarded traffic between en0 and bridge100 by default.
#   2. Even when it does, the container's default route is OrbStack's NAT
#      gateway (192.168.139.1), so a reply to an off-link LAN host gets SNATed
#      to 192.168.15.4. The client opened its connection to 192.168.139.2, sees
#      a reply from 192.168.15.4, and drops it. Asymmetric NAT.
#
# Adding a route inside the VM to fix (2) was tried on 2026-08-29 and made it
# worse - it broke container->LAN entirely, because of (1). Reverted.
#
# THE FIX
# Source-NAT inbound LAN traffic to bridge100's own address. The container then
# sees the connection as coming from 192.168.139.3, which is ON-LINK, so it
# replies directly rather than via OrbStack's NAT. pf un-NATs on the way back.
# The path is symmetric, and neither OrbStack nor the container is modified.
#
# WHAT THIS MAKES WORK
# Every integration where the DEVICE connects back to HA: Sonos UPnP event
# subscriptions, Reolink event callbacks, SamsungTV UPnP, and the unicast half
# of mDNS discovery - which is why Cast could momentarily see the soundbar but
# never hold it.

lan_if = "en0"
vm_if = "bridge100"
lan_net = "192.168.15.0/24"
vm_net = "192.168.138.0/23"

# Rewrite the source so the container answers on-link instead of via OrbStack.
nat on $vm_if from $lan_net to $vm_net -> ($vm_if)

# Permit the forwarding itself. Without these the NAT rule is never reached.
pass in  quick on $lan_if from $lan_net to $vm_net keep state
pass out quick on $vm_if  from any     to $vm_net keep state
